<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Duolingo-style practice for AP Physics 1 Unit 2: forces, free-body diagrams, Newton's laws, friction, springs, circular motion and real AP FRQs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 110'%3E%3Crect x='18' y='24' width='74' height='70' rx='18' fill='%23FFB21E'/%3E%3Cpath d='M37 54q6-7 12 0M61 54q6-7 12 0M44 66q11 11 22 0' stroke='%231B2140' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M55 22V6' stroke='%23F2553A' stroke-width='6'/%3E%3Cpath d='M47 10l8-9 8 9z' fill='%23F2553A'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nush's Physics Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; a zig-zag skill path on the home view, a full-screen lesson card stack on top of it. */
:root{
  --bg:#EEF1FA; --surface:#FFFFFF; --sunk:#E3E7F4; --ink:#1B2140; --muted:#5E6688; --line:#D3D8EA;
  --force:#F2553A; --force-deep:#C23C24; --force-soft:#FDE4DE;
  --go:#1FA874; --go-deep:#13805A; --go-soft:#D8F4E8;
  --xp:#FFB21E; --xp-deep:#D98E00; --xp-soft:#FFF0CF;
  --field:#4462F2; --field-deep:#2D47C4; --field-soft:#E0E6FE;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11142A; --surface:#1B2042; --sunk:#151935; --ink:#EDF0FB; --muted:#9CA3C8; --line:#2E355F;
  --force:#FF6A4D; --force-deep:#B9442D; --force-soft:#3A2230;
  --go:#2CC68C; --go-deep:#178A5F; --go-soft:#173A36;
  --xp:#FFC24A; --xp-deep:#B88512; --xp-soft:#3A3226;
  --field:#7D93FF; --field-deep:#4B60D0; --field-soft:#232B5C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11142A; --surface:#1B2042; --sunk:#151935; --ink:#EDF0FB; --muted:#9CA3C8; --line:#2E355F;
  --force:#FF6A4D; --force-deep:#B9442D; --force-soft:#3A2230;
  --go:#2CC68C; --go-deep:#178A5F; --go-soft:#173A36;
  --xp:#FFC24A; --xp-deep:#B88512; --xp-soft:#3A3226;
  --field:#7D93FF; --field-deep:#4B60D0; --field-soft:#232B5C; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--field)}
:focus-visible{outline:3px solid var(--field);outline-offset:3px;border-radius:12px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand svg{width:34px;height:34px}
@media (max-width:480px){.brand{font-size:17px;gap:4px}.brand svg{width:28px;height:28px}.top .wrap{gap:6px}.stats{gap:2px}}
.stats{display:flex;align-items:center;gap:6px}
.stat{display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:17px;padding:4px 8px;border-radius:12px;font-variant-numeric:tabular-nums}
.stat.streak{color:var(--force)} .stat.xp{color:var(--xp-deep)}
:root[data-theme="dark"] .stat.xp{color:var(--xp)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat.xp{color:var(--xp)}}
.iconbtn{background:none;border:0;padding:6px;border-radius:12px;color:var(--muted);display:flex}
.iconbtn:hover{background:var(--sunk)}

.tabs{display:flex;gap:6px;padding-block:14px 4px}
.tab{flex:1;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:9px 10px;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-selected="true"]{color:var(--field);border-color:var(--field);background:var(--field-soft)}

/* unit banner */
.banner{margin-top:14px;background:var(--field);color:#fff;border-radius:20px;padding:18px 18px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;box-shadow:0 5px 0 var(--field-deep);position:relative;overflow:hidden}
.acct{position:relative;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0;display:grid;place-items:center;color:var(--muted);overflow:visible}
.acct img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.acct svg.ic{width:20px;height:20px}
.dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--muted)}
.dot.synced{background:var(--go)} .dot.device{background:var(--xp)} .dot.loading{background:var(--line)}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.sheet-head > svg,.sheet-head > img{width:56px;height:56px}
.sheet-head > img{border-radius:50%}
.sheet-head .dot{display:none}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;text-wrap:balance}
.sheet h4{margin:4px 0 -4px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet .tiles3{max-width:none}
.sync,.muted{margin:2px 0 0;font-size:14px;color:var(--muted)}
.sync.synced{color:var(--go-deep)}
:root[data-theme="dark"] .sync.synced{color:var(--go)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sync.synced{color:var(--go)}}
.goalopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.goalopts .choice{flex-direction:column;align-items:flex-start;gap:0;padding:10px 12px}
.goalopts .choice b{font-family:var(--f-display);font-weight:600}
.goalopts .choice span{font-size:13px;color:var(--muted)}
.sheet-btns{display:flex;flex-wrap:wrap;gap:10px}
.sheet-btns .btn{margin-left:0;flex:1 1 180px;min-width:0}
.btn.danger{color:var(--force);border-color:var(--force-soft)}
.today{margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.today-top{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.today-top svg{width:64px;height:64px}
.today-txt{min-width:0}
.today small{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.today h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2;text-wrap:balance}
.today p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.today-act{display:flex;gap:10px;flex-wrap:wrap}
.today-act .btn{margin-left:0;flex:1 1 160px;min-width:0}
.focus-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.focus-row > span{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--force)}
.fchip-go{background:var(--force-soft);color:var(--ink);border:2px solid var(--force);border-radius:999px;padding:4px 12px;font-size:14px}
.focus-tag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:6px;background:var(--force);color:#fff;letter-spacing:.06em;font-size:10px;vertical-align:1px}
.results{list-style:none;margin:0;padding:0;width:100%;max-width:440px;display:flex;flex-direction:column;gap:6px;text-align:left}
.results li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.rchip{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px;flex:none}
.rchip.ok{background:var(--go-soft);color:var(--go-deep)} .rchip.no{background:var(--force-soft);color:var(--force-deep)}
:root[data-theme="dark"] .rchip.ok{color:var(--go)} :root[data-theme="dark"] .rchip.no{color:var(--force)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rchip.ok{color:var(--go)} :root:not([data-theme="light"]) .rchip.no{color:var(--force)}}
.onb .l-body .wrap{padding-top:40px;gap:18px}
.choice .k svg.ic{width:18px;height:18px}
.banner.class{background:var(--go);box-shadow:0 5px 0 var(--go-deep)}
.banner.frq{background:var(--force);box-shadow:0 5px 0 var(--force-deep)}
.setup{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--force);border-radius:14px;padding:0 14px}
.setup summary{cursor:pointer;padding:10px 0;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--force-deep);list-style-position:inside}
:root[data-theme="dark"] .setup summary{color:var(--force)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .setup summary{color:var(--force)}}
.setup[open]{padding-bottom:12px}
.setup .prose{max-height:300px;overflow-y:auto;font-size:15px}
.setup .fig{padding:6px}
.setup .fig svg{max-width:340px}
.setup .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.parts-note{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--muted)}
.parts-note svg.ic{width:18px;height:18px}
.practice{padding-block:18px 80px;display:flex;flex-direction:column;gap:12px}
.practice h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0}
.practice h4{margin:6px 0 0;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pmodes .choice b{font-family:var(--f-display);font-weight:600;font-size:17px}
.pmodes .choice .muted{font-size:14px}
.choice:disabled{opacity:.5;cursor:default}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{background:var(--surface);border:2px solid var(--line);border-bottom-width:3px;border-radius:999px;padding:6px 12px;font-size:14px}
.tchip[aria-pressed="true"]{border-color:var(--field);background:var(--field-soft);color:var(--ink)}
.pstart{padding-top:6px}
.pstart .btn{margin-left:0;width:100%}
.frq-group{display:flex;flex-direction:column;gap:10px}
.frq-gt{margin:8px 0 0;font-family:var(--f-display);font-weight:700;font-size:20px}
.frq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.frq-card{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.frq-card.is-done{border-color:var(--xp)}
.frq-card h3{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2;text-wrap:balance}
.frq-card .muted{margin:0}
.frq-meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.frq-meta .chip{margin:0}
.frq-status{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-family:var(--f-display);font-weight:600}
.frq-status svg.ic{width:16px;height:16px;color:var(--xp-deep)}
.frq-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.frq-act .btn{margin-left:0;min-width:0;padding:9px 18px;font-size:15px}
.frq-links{display:flex;gap:12px;font-size:14px;font-weight:700}
.frq-links a{text-decoration:none}
.frq-links a:hover{text-decoration:underline}
.banner.mcq{background:var(--field-deep);box-shadow:0 5px 0 var(--field)}
.choices.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.pics .choice{flex-direction:column;align-items:flex-start}
.choices.pics svg.mini{width:100%;max-width:200px;height:auto}
.choices.pics text{font-family:var(--f-mono);font-weight:700}
.ctx{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--field);border-radius:14px;padding:10px 14px;font-size:15px;max-width:62ch}
.banner small{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-size:12px}
.banner h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;text-wrap:balance}
.banner .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;opacity:.95;margin-top:4px}
.goal{grid-row:1/3;grid-column:2;align-self:center;width:62px;height:62px;position:relative}
.goal svg{width:62px;height:62px;transform:rotate(-90deg)}
.goal span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1;text-align:center}

/* path */
.path{list-style:none;margin:0;padding:56px 0 50px;display:flex;flex-direction:column;align-items:center;gap:22px;position:relative}
.row{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x,0));position:relative}
.node{width:76px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;transition:transform .08s}
.node svg.ic{width:32px;height:32px;stroke-width:2.6}
.node:active{transform:translateY(5px)}
.node.done{background:var(--xp);color:#fff;box-shadow:0 6px 0 var(--xp-deep)}
.node.open{background:var(--go);color:#fff;box-shadow:0 6px 0 var(--go-deep)}
.node.locked{background:var(--sunk);color:var(--muted);box-shadow:0 6px 0 var(--line)}
.node.k-boss{width:86px;height:80px;border-radius:26px;transform:rotate(45deg)}
.node.k-boss > *{transform:rotate(-45deg)}
.node.k-boss:active{transform:rotate(45deg) translateY(4px)}
.node.k-boss.open{background:var(--force);box-shadow:0 6px 0 var(--force-deep)}
.node .tag{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em}
.node.open::after{content:"";position:absolute;inset:-9px;border-radius:inherit;border:4px solid var(--go);opacity:.35;animation:pulse 1.6s ease-in-out infinite}
.node.k-boss.open::after{border-color:var(--force)}
@keyframes pulse{50%{inset:-14px;opacity:.12}}
.label{font-family:var(--f-display);font-weight:600;font-size:15px;text-align:center;max-width:200px;line-height:1.2;color:var(--ink)}
.label b{display:block;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row.locked .label{color:var(--muted)}
.bubble{position:absolute;top:-44px;background:var(--surface);color:var(--go);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;z-index:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.row.bossrow .bubble{color:var(--force);top:-50px}
@keyframes bob{50%{transform:translateY(-5px)}}
.side-newt{position:absolute;width:96px;opacity:.95;pointer-events:none}
.hint{font-size:13px;color:var(--muted);text-align:center;max-width:44ch;margin:0 auto}

/* exams view */
.exams{padding-block:18px 80px;display:flex;flex-direction:column;gap:14px}
.exams h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:4px 0 0}
.exams p{margin:0;color:var(--muted);max-width:62ch}
.year{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.year header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.year h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px}
.year .links{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--field);color:var(--field);text-decoration:none;background:var(--surface)}
.pill svg.ic{width:16px;height:16px}
.pill:hover{background:var(--field-soft)}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qlist li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline}
.qn{font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--sunk);border-radius:8px;padding:2px 7px;color:var(--ink)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--force-soft);color:var(--force-deep);margin-left:4px;vertical-align:1px}
:root[data-theme="dark"] .chip{color:var(--force)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{color:var(--force)}}

/* lesson overlay */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{width:100%;display:flex;align-items:center;gap:14px;padding-block:14px}
.bar{flex:1;height:16px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);border-radius:999px;transition:width .35s cubic-bezier(.3,1.4,.6,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.hearts{display:flex;align-items:center;gap:4px;color:var(--force);font-family:var(--f-display);font-weight:700;font-size:18px}
.hearts svg.ic{fill:var(--force);stroke:var(--force)}
.hearts.hit{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.l-body{flex:1;overflow-y:auto}
.l-body .wrap{padding-block:10px 30px;display:flex;flex-direction:column;gap:16px}
.kicker{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--field)}
.kicker.boss{color:var(--force)}
.qtitle{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.25;margin:0;text-wrap:balance}
.prose{max-width:62ch}
.prose p{margin:0 0 10px}
.eq{font-family:var(--f-mono);font-weight:500;background:var(--sunk);border-radius:8px;padding:1px 6px;white-space:nowrap}
.eqblock{font-family:var(--f-mono);font-weight:700;font-size:18px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:center;overflow-x:auto}

.choice.right{border-color:var(--go);background:var(--go-soft)}
.choice.wrong{border-color:var(--force);background:var(--force-soft)}

}

/* tiny graphs used as answer choices for "sketch a graph" parts */
function mini(curves, xl='t', yl='y'){
  const P=(x,y)=>`${(14+98*x).toFixed(1)},${(64-54*y).toFixed(1)}`;
  return `<svg class="mini" viewBox="0 0 120 78" aria-hidden="true">
    <line x1="14" y1="6" x2="14" y2="66" class="s-muted" stroke-width="1.5"/><line x1="14" y1="66" x2="116" y2="66" class="s-muted" stroke-width="1.5"/>
    <text x="4" y="12" class="t-muted" style="font-size:9px">${yl}</text><text x="114" y="76" text-anchor="end" class="t-muted" style="font-size:9px">${xl}</text>
    ${curves.map(c=>{const pts=Array.from({length:21},(_,i)=>{const x=i/20;return [x,c.f(x)];}).filter(([,y])=>y>=0&&y<=1.05);
      const [lx,ly]=pts[pts.length-1];
      return `<polyline points="${pts.map(([x,y])=>P(x,y)).join(' ')}" fill="none" class="s-${c.c}" stroke-width="2.5"/>${c.l?`<text x="${Math.min(14+98*lx+3,104).toFixed(1)}" y="${(64-54*ly+(ly>0.5?8:0)).toFixed(1)}" class="t-${c.c}" style="font-size:9px">${c.l}</text>`:''}`;}).join('')}
  </svg>`;
}

{id:'2.1', kind:'lesson', title:'Systems & Center of Mass', topic:'center of mass',
 learn:[
  {h:'You pick the system', body:`<p>A <b>system</b> is whatever objects you decide to analyze. Forces from things outside it are <b>external</b>. Forces between parts inside it are <b>internal</b>, and they come in equal-and-opposite pairs that cancel.</p><p>So only external forces can change how the system as a whole moves.</p>`},
  {h:'Center of mass', body:`<p>A system's motion is the motion of its <b>center of mass</b>. For objects on a line:</p><div class="eqblock">x<sub>cm</sub> = (m₁x₁ + m₂x₂ + …) / (m₁ + m₂ + …)</div><p>Uniform, symmetric objects have their center of mass at the geometric center.</p>`, fig:'cm'},
 ],
 qs:[
  {t:'mc', q:'A hand pushes block A, which pushes block B across a frictionless floor. You choose A + B as the system. Which force is internal?', c:['The force of A on B','The hand on A','Earth\'s gravity on B','The floor\'s normal force on A'], a:0, why:'A and B are both inside the system, so the A-on-B force (and its B-on-A partner) is internal. The hand, Earth, and floor are outside.'},
  {t:'num', q:'A 2 kg mass sits at x = 0 and a 6 kg mass at x = 4 m. Where is the center of mass?', a:3, unit:'m', why:'(2·0 + 6·4) / (2 + 6) = 24 / 8 = 3 m. It sits closer to the heavier mass.'},
  {t:'tf', q:'Internal forces can change the velocity of a system\'s center of mass.', a:false, why:'Internal forces come in Newton\'s third law pairs that cancel when you add them up for the whole system. Only a net external force changes the center of mass velocity.'},
  {t:'mc', q:'An astronaut floating at rest in space throws a wrench. What does the center of mass of the astronaut + wrench system do?', c:['Stays at rest','Moves with the wrench','Moves with the astronaut','Speeds up, then stops'], a:0, why:'The throw is an internal force. No external force acts, so the center of mass keeps its original velocity: zero.'},
  {t:'num', q:'A uniform 0.2 kg meterstick has a 0.3 kg mass hung at the 100 cm mark. Where is the center of mass of the stick + mass system?', a:80, unit:'cm', why:'The stick acts like 0.2 kg at 50 cm. (0.2·50 + 0.3·100) / 0.5 = 40 / 0.5 = 80 cm.'},
  {t:'mc', q:'When can you model a system as a single object (a dot)?', c:['When its internal structure doesn\'t matter for the question','Only when it is smaller than 1 m','Only when no forces act on it','Only when it is at rest'], a:0, why:'The AP course says you can treat a system as an object when changes inside it don\'t matter for what you are asking.'},
 ]},

{id:'2.2', kind:'lesson', title:'Forces & Free-Body Diagrams', topic:'free body diagrams',
 learn:[
  {h:'Every force has a source', body:`<p>A force is a push or pull <b>between two objects</b>, measured in newtons (N). If you can\'t name what is doing the pushing, it isn\'t a force.</p><p><b>Contact forces:</b> normal, tension, friction, spring. <b>Field force:</b> gravity, which acts without touching.</p>`},
  {h:'How AP wants your FBD', body:`<p>Draw the object as a dot. Draw each force as an arrow that <b>starts on the dot and points away</b>, with a label like F<sub>g</sub> or F<sub>N</sub>.</p><p>Never draw components, velocity, or an "ma" arrow. Those cost points on the exam.</p>`, fig:'book'},
 ],
 qs:[
  {t:'fbd', q:'A book rests on a level table. Pick every force acting on the book.', f:[F('g','Gravity from Earth','F_g',-90,1),F('n','Normal force from table','F_N',90,1),F('fr','Friction','F_f',180,0),F('m','Force of motion','F_m',0,0)], why:'Only Earth (gravity, down) and the table (normal, up) touch or pull on the book. It isn\'t sliding, so there\'s no friction.'},
  {t:'fbd', q:'A ball has been thrown straight up and is still rising. Ignore air. Pick every force on the ball.', f:[F('g','Gravity from Earth','F_g',-90,1),F('th','Force of the throw','F_throw',90,0),F('n','Normal force','F_N',90,0),F('a','Air resistance','F_air',-90,0)], why:'Once it leaves your hand, the hand exerts nothing. Only gravity acts. The ball keeps rising because it already has upward velocity, not because of an upward force.'},
  {t:'mc', q:'Which arrow should never appear on an AP free-body diagram?', c:['An "ma" arrow','A tension arrow','A friction arrow','A normal force arrow'], a:0, why:'ma is the result of the net force, not a force itself. Putting it on the diagram double-counts.'},
  {t:'fbd', q:'A rope pulls a box to the right across a rough floor at constant velocity. Pick every force on the box.', f:[F('g','Gravity','F_g',-90,1),F('n','Normal from floor','F_N',90,1),F('t','Tension from rope','F_T',0,1),F('fr','Kinetic friction','F_f',180,1),F('m','Force of motion','F_m',0,0)], why:'Four real forces: gravity, normal, tension forward, friction backward. Constant velocity means tension and friction balance.'},
  {t:'mc', q:'Which way does a normal force point?', c:['Perpendicular to the surface, pushing away from it','Always straight up','Opposite to gravity','In the direction of motion'], a:0, why:'"Normal" means perpendicular. On a ramp it tilts with the surface, so it isn\'t always straight up.'},
  {t:'fbd', q:'A lamp hangs at rest from a single cord. Pick every force on the lamp.', f:[F('g','Gravity','F_g',-90,1),F('t','Tension from cord','F_T',90,1),F('n','Normal from ceiling','F_N',-90,0)], why:'The cord pulls up, Earth pulls down. The ceiling only touches the cord, not the lamp.'},
  {t:'tf', q:'The normal force on an object always equals mg.', a:false, why:'It equals whatever the surface needs to push. On a ramp it\'s mg·cosθ; in an accelerating elevator it\'s m(g + a); if you press down on a book, it\'s more than mg.'},
 ]},

{id:'boss-fbd', kind:'boss', title:'FRQ: The hinged beam', year:'2024', qnum:'Q3 (a)', src:SRC.y24,
 intro:`<p>A uniform beam of mass M is attached to a wall by a <b>hinge</b> at its left end. A string runs from the beam\'s right end up to the wall above the hinge, making an angle θ with the beam. The beam stays horizontal.</p><p>Part (a) asks you to draw and label the forces on the beam. Let\'s do it.</p>`,
 steps:[
  {t:'fbd', q:'Pick every force exerted on the beam.', f:[F('g','Gravity (at the center)','F_g',-90,1),F('t','Tension along the string','F_T',150,1),F('h','Hinge force from the wall','F_H',30,1),F('n','Normal force from the floor','F_N',90,0),F('tq','Torque','τ',0,0)], why:'Three forces: gravity, string tension (pulling up and toward the wall), and the hinge. Torque isn\'t a force, and nothing is underneath the beam.'},
  {t:'mc', q:'The string pulls the beam toward the wall. What keeps the beam from moving toward the wall?', c:['The hinge pushes the beam away from the wall','Gravity pulls it away from the wall','Friction from the air','Nothing, it\'s not in equilibrium'], a:0, why:'The beam is at rest, so horizontal forces balance. Only the hinge can push horizontally away from the wall.'},
  {t:'mc', q:'The string supports part of the beam\'s weight. In which direction must the hinge force point?', c:['Up and away from the wall','Straight down','Down and toward the wall','Straight toward the wall'], a:0, why:'It must push away from the wall (to balance tension) and up (the string holds only part of the weight). So it points up and away from the wall.'},
 ],
 model:`<p>On the dot: <b>F<sub>g</sub></b> straight down, <b>F<sub>T</sub></b> along the string toward the upper wall attachment, and <b>F<sub>H</sub></b> from the hinge, up and away from the wall. Three distinct arrows, each starting on the beam and pointing away.</p><p>Check the official scoring guidelines to see exactly which labels and directions earned the point.</p>`},

{id:'2.3', kind:'lesson', title:'Newton\'s Third Law', topic:'Newton\'s third law',
 learn:[
  {h:'Forces come in pairs', body:`<p>If A pushes on B, then B pushes on A with a force that is <b>equal in size, opposite in direction, and the same type</b>.</p><div class="eqblock">F<sub>A on B</sub> = −F<sub>B on A</sub></div>`},
  {h:'Why they don\'t cancel', body:`<p>The two forces act on <b>different objects</b>, so they never appear on the same free-body diagram. Each object accelerates based only on forces acting on it.</p><p>A heavy truck and a tiny bug feel the same force in a crash. The bug just has far less mass, so its acceleration is huge.</p>`},
 ],
 qs:[
  {t:'mc', q:'A truck hits a bug. How does the force on the bug compare with the force on the truck?', c:['They are equal','The bug feels more force','The truck feels more force','The bug feels force, the truck feels none'], a:0, why:'Third law pairs are always equal in magnitude. The difference you see is in acceleration (a = F/m).'},
  {t:'mc', q:'Earth pulls down on a book with gravity. What is the third law partner of that force?', c:['The book pulls up on Earth','The table pushes up on the book','The book pushes down on the table','There is no partner'], a:0, why:'The partner swaps the two objects: Earth on book becomes book on Earth. The table\'s normal force is a different interaction.'},
  {t:'tf', q:'Because third law forces are equal and opposite, they cancel and nothing can accelerate.', a:false, why:'They act on different objects. To find one object\'s acceleration, add only the forces on that object.'},
  {t:'mc', q:'A horse pulls a cart and both speed up. Why does the horse move forward?', c:['The ground pushes the horse forward harder than the cart pulls back on it','The horse pulls the cart harder than the cart pulls the horse','The cart\'s pull on the horse is zero','The horse\'s inertia carries it'], a:0, why:'Horse-on-cart and cart-on-horse are equal. The horse accelerates because friction from the ground (pushing forward) beats the cart\'s backward pull.'},
  {t:'num', q:'You push a wall with 50 N. How hard does the wall push you?', a:50, unit:'N', why:'Equal and opposite: 50 N, pointed back at you.'},
  {t:'num', q:'On frictionless ice, a 60 kg skater pushes a 20 kg box with 30 N. What is the size of the skater\'s acceleration?', a:0.5, unit:'m/s²', why:'The box pushes back with 30 N. a = 30 / 60 = 0.5 m/s². (The box gets 30 / 20 = 1.5 m/s².)'},
 ]},

{id:'2.4', kind:'lesson', title:'Newton\'s First Law', topic:'Newton\'s first law inertia',
 learn:[
  {h:'Zero net force, constant velocity', body:`<p>If the forces on an object add to zero, its velocity doesn\'t change. That includes sitting still <b>and</b> cruising at a steady speed in a straight line.</p><div class="eqblock">ΣF = 0 ⇔ v = constant</div>`},
  {h:'Inertia', body:`<p><b>Inertia</b> is an object\'s resistance to changes in velocity, and mass measures it. You don\'t need a force to keep moving; you need a force to <b>change</b> how you\'re moving.</p><p>An object with ΣF = 0 is in <b>translational equilibrium</b>.</p>`},
 ],
 qs:[
  {t:'mc', q:'A puck slides across frictionless ice at 5 m/s. What force is needed to keep it going at 5 m/s?', c:['None','A small forward force','A force equal to its weight','A force that grows over time'], a:0, why:'With zero net force, velocity stays constant. Forces change motion; they don\'t maintain it.'},
  {t:'mc', q:'An elevator moves upward at constant speed. How does cable tension compare with the elevator\'s weight?', c:['Equal','Greater','Less','Zero'], a:0, why:'Constant velocity means ΣF = 0, so tension exactly balances gravity, even while moving up.'},
  {t:'tf', q:'If something is moving, there must be a net force on it.', a:false, why:'That\'s the most common misconception in physics. Moving at constant velocity needs zero net force.'},
  {t:'mc', q:'A car brakes hard and the passenger lurches forward. Why?', c:['Their body tends to keep moving at the original velocity','A forward force pushes them','The seat pushes them forward','Gravity tilts forward'], a:0, why:'There\'s no forward force. The car slows down and the passenger\'s body keeps going until the seatbelt applies a backward force.'},
  {t:'mc', q:'Which object is in translational equilibrium?', c:['A skydiver falling at terminal velocity','A ball at the very top of its flight','A car rounding a curve at constant speed','A rocket speeding up'], a:0, why:'Terminal velocity is constant velocity, so ΣF = 0. The ball still has gravity acting; the car is changing direction; the rocket is speeding up.'},
  {t:'num', q:'You push a crate across a floor at constant velocity with a 120 N horizontal force. How big is the friction force?', a:120, unit:'N', why:'Constant velocity means the forces balance: friction = 120 N, opposite your push.'},
 ]},

{id:'2.5', kind:'lesson', title:'Newton\'s Second Law', topic:'Newton\'s second law',
 learn:[
  {h:'The big one', body:`<div class="eqblock">a = ΣF / m</div><p>Acceleration points in the direction of the <b>net</b> force. Double the net force, double the acceleration. Double the mass, halve it.</p>`},
  {h:'The recipe', body:`<p>1. Choose your system. 2. Draw the FBD. 3. Pick axes, one along the acceleration. 4. Write ΣF = ma for each axis. 5. Solve.</p><p>With connected objects, treat them as <b>one system</b> to find a, then isolate one object to find the force between them.</p>`},
 ],
 qs:[
  {t:'num', q:'A 4 kg cart has a net force of 20 N on it. Find its acceleration.', a:5, unit:'m/s²', why:'a = 20 / 4 = 5 m/s².'},
  {t:'num', q:'A 2 kg box is pulled right with 15 N while friction pulls left with 5 N. Find its acceleration.', a:5, unit:'m/s²', why:'ΣF = 15 − 5 = 10 N right. a = 10 / 2 = 5 m/s².'},
  {t:'num', q:'A 50 kg student stands on a scale in an elevator accelerating upward at 2 m/s². What does the scale read? (g = 9.8 m/s²)', a:590, unit:'N', why:'F_N − mg = ma, so F_N = m(g + a) = 50 × 11.8 = 590 N. The scale reads the normal force.'},
  {t:'num', q:'Blocks of 3 kg and 1 kg sit side by side on a frictionless floor. An 8 N push acts on the 3 kg block. How hard does the 3 kg block push the 1 kg block?', a:2, unit:'N', why:'Whole system: a = 8 / 4 = 2 m/s². The 1 kg block alone needs F = 1 × 2 = 2 N, and only the 3 kg block pushes it.'},
  {t:'num', q:'A 2 kg cart on a frictionless table is tied over a pulley to a hanging 0.5 kg mass. Find the acceleration. (g = 9.8 m/s²)', a:1.96, unit:'m/s²', why:'Only the hanging weight drives the whole 2.5 kg system: a = (0.5 × 9.8) / 2.5 = 1.96 m/s².'},
  {t:'tiles', q:'Build Newton\'s second law for the hanging mass m₂ in that setup (down is positive).', tiles:['m₂g','−','T','=','m₂a','+','m₁a'], ans:['m₂g','−','T','=','m₂a'], why:'On the hanging mass: gravity down, tension up. Net force m₂g − T equals m₂a.'},
  {t:'mc', q:'A ball is thrown straight up. At the very top, what is its acceleration?', c:['9.8 m/s² downward','Zero','9.8 m/s² upward','It depends on the throw speed'], a:0, why:'Velocity is momentarily zero, but gravity is still the net force. a = g downward the whole flight.'},
 ]},

{id:'2.6', kind:'lesson', title:'Gravitational Force', topic:'gravitational force',
 learn:[
  {h:'Universal gravitation', body:`<div class="eqblock">F<sub>g</sub> = G m₁m₂ / r²</div><p>Every mass pulls on every other mass. r is the distance between their <b>centers</b>. Double r and the force drops to one fourth.</p>`},
  {h:'Near a planet\'s surface', body:`<p>The pull becomes F<sub>g</sub> = mg, where <span class="eq">g = GM/R²</span> is the gravitational field (9.8 N/kg on Earth).</p><p>A scale doesn\'t read gravity. It reads the <b>normal force</b>, which is your apparent weight.</p>`},
 ],
 qs:[
  {t:'mc', q:'The distance between two moons\' centers doubles. The gravitational force between them becomes…', c:['¼ as large','½ as large','2× as large','4× as large'], a:0, why:'Inverse square: (1/2)² = 1/4.'},
  {t:'mc', q:'Planet X has the same mass as Earth but a larger radius. How does g at its surface compare?', c:['Smaller','Larger','The same','Depends on the object'], a:0, why:'g = GM/R². Same M, bigger R means smaller g. Hold onto this, the next boss uses it.'},
  {t:'num', q:'A planet has 2× Earth\'s mass and 2× Earth\'s radius. What is g at its surface? (Earth: 9.8 m/s²)', a:4.9, unit:'m/s²', why:'g scales as M/R² = 2 / 4 = ½. Half of 9.8 is 4.9 m/s².'},
  {t:'tf', q:'Astronauts on the space station float because there is no gravity up there.', a:false, why:'Gravity there is about 90% of what it is on the surface. They float because they\'re in free fall along with the station.'},
  {t:'mc', q:'You stand on a scale in an elevator whose cable snaps (free fall). The scale reads…', c:['Zero','Your normal weight','Double your weight','Half your weight'], a:0, why:'You and the scale fall together with a = g, so the scale doesn\'t need to push on you. F_N = 0.'},
  {t:'num', q:'Find the weight of a 70 kg person on Earth. (g = 9.8 m/s²)', a:686, unit:'N', why:'F_g = mg = 70 × 9.8 = 686 N.'},
  {t:'mc', q:'A bowling ball and a tennis ball are dropped together in a vacuum. Which lands first?', c:['They land together','The bowling ball','The tennis ball','Depends on height'], a:0, why:'Bigger mass means bigger gravitational force but also more inertia. They cancel: a = g for both.'},
 ]},

{id:'boss-planet', kind:'boss', title:'FRQ: The pendulum on Planet X', year:'2024', qnum:'Q4 (a)', src:SRC.y24,
 intro:`<p>A small sphere on a string is pulled to a small angle and released, swinging to its lowest point. On Earth, the work Earth\'s gravity does on it over that swing is W<sub>E</sub>.</p><p>The same pendulum goes to <b>Planet X</b>: same mass as Earth, <b>larger radius</b>. Same angle, same swing. The work done by Planet X is W<sub>X</sub>. Part (a) asks you to justify why W<sub>X</sub> is less than W<sub>E</sub>.</p>`,
 steps:[
  {t:'mc', q:'How does the gravitational field at Planet X\'s surface compare with Earth\'s?', c:['Weaker, because g = GM/R² and R is larger','Stronger, because the planet is bigger','The same, because the masses match','It can\'t be determined'], a:0, why:'Same M, larger R. Since R is squared in the denominator, g is smaller.'},
  {t:'mc', q:'Does the sphere drop the same vertical height from release to the lowest point on both planets?', c:['Yes, same string length and angle','No, it drops less on Planet X','No, it drops more on Planet X','It depends on g'], a:0, why:'The height drop depends only on geometry: L(1 − cosθ). Geometry doesn\'t change between planets.'},
  {t:'mc', q:'Which is the best justification that W_X < W_E?', c:['Work by gravity is mgΔh; Δh is the same but g is smaller on X','The sphere moves slower on X so there\'s less work','Gravity does negative work on Planet X','The string does more work on Planet X'], a:0, why:'Gravity\'s work over a vertical drop is F_g·Δh = mgΔh. Same m and Δh, smaller g, so less work.'},
 ],
 model:`<p>The gravitational field at a planet\'s surface is g = GM/R². Planet X has the same mass but a larger radius, so g<sub>X</sub> &lt; g<sub>E</sub>. The sphere falls the same height Δh on both planets because the string length and starting angle are unchanged. Work done by gravity is mgΔh, so with a smaller g, W<sub>X</sub> &lt; W<sub>E</sub>.</p>`},

{id:'2.7', kind:'lesson', title:'Kinetic & Static Friction', topic:'static and kinetic friction',
 learn:[
  {h:'Kinetic friction: sliding', body:`<div class="eqblock">F<sub>f,k</sub> = μ<sub>k</sub> F<sub>N</sub></div><p>Opposes the sliding. It doesn\'t depend on speed or contact area in the AP model, only on the surfaces (μ) and how hard they press together (F<sub>N</sub>).</p>`},
  {h:'Static friction: not sliding', body:`<div class="eqblock">F<sub>f,s</sub> ≤ μ<sub>s</sub> F<sub>N</sub></div><p>Static friction is only as big as it needs to be to prevent slipping, up to a maximum. Usually μ<sub>s</sub> &gt; μ<sub>k</sub>, which is why it\'s harder to start a box moving than to keep it moving.</p><p>On a ramp, F<sub>N</sub> = mg cosθ.</p>`, fig:'incline'},
 ],
 qs:[
  {t:'num', q:'A 10 kg box slides across a level floor with μk = 0.3. Find the friction force. (g = 9.8 m/s²)', a:29.4, unit:'N', why:'F_N = mg = 98 N. F_f = 0.3 × 98 = 29.4 N.'},
  {t:'mc', q:'A box can take up to 50 N of static friction. You push it with 20 N and it doesn\'t move. What is the static friction force?', c:['20 N','50 N','30 N','0 N'], a:0, why:'Static friction matches what\'s needed to keep ΣF = 0. You push 20 N, so it pushes back 20 N. 50 N is only the maximum.'},
  {t:'tf', q:'Static friction always equals μs·F_N.', a:false, why:'μs·F_N is the maximum. Static friction can be anything from zero up to that value.'},
  {t:'num', q:'A puck slides on a level floor with μk = 0.2 and no other horizontal forces. Find the magnitude of its deceleration.', a:1.96, unit:'m/s²', why:'μk·mg = ma, so a = μk·g = 0.2 × 9.8 = 1.96 m/s². The mass cancels.'},
  {t:'mc', q:'A block sits at rest on a ramp. Which way does static friction point?', c:['Up the ramp','Down the ramp','Perpendicular to the ramp','There is no friction'], a:0, why:'Gravity\'s component pulls it down the slope, so friction points up the slope to hold it still.'},
  {t:'num', q:'A block just starts to slide when the ramp is tilted to 35°. Find μs.', a:0.70, unit:'', why:'At the slipping point, mg sinθ = μs mg cosθ, so μs = tan 35° ≈ 0.70.'},
  {t:'mc', q:'A car\'s tires roll without skidding. What kind of friction pushes the car forward?', c:['Static','Kinetic','Rolling only, no friction','Air friction'], a:0, why:'The contact patch isn\'t sliding relative to the road, so it\'s static friction.'},
  {t:'fbd', q:'A block slides down a rough ramp (the ramp goes down to the right). Pick every force on the block.', f:[F('g','Gravity','F_g',-90,1),F('n','Normal, perpendicular to ramp','F_N',68.6,1),F('fu','Friction up the ramp','F_f',158.6,1),F('fd','Friction down the ramp','F_f',-21.4,0),F('m','Force of motion down ramp','F_m',-21.4,0)], why:'Gravity straight down, normal perpendicular to the surface, and kinetic friction up the slope, opposite the sliding.'},
 ]},

{id:'boss-ramp', kind:'boss', title:'FRQ: Finding μ on a ramp', year:'2026', qnum:'Q3 (C–D)', src:SRC.y26,
 intro:`<p>Students release a block from rest on a rough ramp tilted at <b>θ = 30°</b>. A photogate a distance <b>d</b> down the ramp measures the block\'s speed <b>v</b>. They repeat this for several values of d. They correctly find that</p><div class="eqblock">v² = 2g(sinθ − μ<sub>k</sub>cosθ)·d</div><p>Their data:</p><div style="overflow-x:auto"><table class="datatable"><tr><th>d (m)</th><th>v (m/s)</th></tr><tr><td>0.20</td><td>0.29</td></tr><tr><td>0.30</td><td>0.38</td></tr><tr><td>0.40</td><td>0.41</td></tr><tr><td>0.50</td><td>0.49</td></tr><tr><td>0.60</td><td>0.52</td></tr></table></div>`,
 steps:[
  {t:'mc', q:'They plot d on the horizontal axis. What should go on the vertical axis to get a straight line?', c:['v²','v','1/v','√v'], a:0, why:'The equation is v² = (constant)·d. That\'s y = mx with y = v².'},
  {t:'num', q:'Calculate v² for the d = 0.60 m trial.', a:0.27, tol:0.04, unit:'m²/s²', why:'0.52² = 0.2704 m²/s².'},
  {t:'num', q:'A best-fit line through (d, v²) has what slope? Estimate it.', a:0.468, tol:0.15, unit:'m/s²', why:'v² runs from about 0.084 to 0.270 as d runs 0.20 to 0.60 m. A least-squares fit gives a slope of about 0.47 m/s². Use the best-fit line, not just two data points.'},
  {t:'num', q:'Slope = 2g(sinθ − μk cosθ). Solve for μk. (g = 9.8 m/s², θ = 30°)', a:0.55, tol:0.05, unit:'', why:'μk = (sinθ − slope/2g) / cosθ = (0.5 − 0.47/19.6) / 0.866 ≈ 0.55. Notice μk is just under tan 30° ≈ 0.58, which is why the block speeds up so slowly.'},
 ],
 model:`<p>Plot <b>v²</b> (m²/s²) against <b>d</b> (m). Draw a best-fit straight line, not dot-to-dot. Its slope equals 2g(sinθ − μ<sub>k</sub>cosθ), so μ<sub>k</sub> = (sinθ − slope/2g)/cosθ ≈ <b>0.55</b>.</p><p>Parts A and B of this question are a design-your-own experiment with a curved ramp and only a meterstick. Try them on paper, then compare with the scoring guidelines.</p>`},

{id:'2.8', kind:'lesson', title:'Spring Forces', topic:'spring force Hooke\'s law',
 learn:[
  {h:'Hooke\'s law', body:`<div class="eqblock">F<sub>s</sub> = −kΔx</div><p>A spring pushes or pulls back toward its natural length with a force proportional to how far it\'s stretched or compressed. k (N/m) measures stiffness. The minus sign means "opposite the displacement."</p>`, fig:'spring'},
  {h:'Graphs and combos', body:`<p>On a force vs. stretch graph, the <b>slope is k</b>.</p><p>Springs side by side (parallel) add: <span class="eq">k = k₁ + k₂</span>. End to end (series) get softer: <span class="eq">1/k = 1/k₁ + 1/k₂</span>.</p>`},
 ],
 qs:[
  {t:'num', q:'A spring with k = 200 N/m is stretched 0.15 m. How much force does it exert?', a:30, unit:'N', why:'F = kΔx = 200 × 0.15 = 30 N.'},
  {t:'num', q:'A 0.5 kg mass hangs at rest from a spring, stretching it 0.049 m. Find k. (g = 9.8 m/s²)', a:100, unit:'N/m', why:'At rest, kΔx = mg. k = (0.5 × 9.8) / 0.049 = 100 N/m.'},
  {t:'mc', q:'You graph spring force (vertical) against stretch (horizontal). The slope represents…', c:['The spring constant k','The mass','The energy stored','The natural length'], a:0, why:'F = kΔx is a line through the origin with slope k.'},
  {t:'mc', q:'A block is pressed against a spring, compressing it. Which way does the spring push the block?', c:['Back toward the spring\'s natural length','Further into the compression','Straight down','There is no force until released'], a:0, why:'Spring forces are restoring: they always point toward equilibrium.'},
  {t:'num', q:'Two identical springs (k = 100 N/m each) hang side by side and share a load. What is the effective spring constant?', a:200, unit:'N/m', why:'Parallel springs add: 100 + 100 = 200 N/m. Each one stretches half as much.'},
  {t:'num', q:'The same two springs are hooked end to end. What is the effective spring constant now?', a:50, unit:'N/m', why:'Series: 1/k = 1/100 + 1/100 = 2/100, so k = 50 N/m. Each spring feels the full load and stretches.'},
  {t:'tf', q:'For an ideal spring, doubling the stretch doubles the force.', a:true, why:'F is proportional to Δx, so it doubles.'},
 ]},

{id:'2.9', kind:'lesson', title:'Circular Motion', topic:'uniform circular motion',
 learn:[
  {h:'Speed constant, velocity not', body:`<p>In uniform circular motion, speed stays the same but the velocity keeps changing direction. That\'s an acceleration, pointing toward the <b>center</b>.</p><div class="eqblock">a<sub>c</sub> = v²/r &nbsp;&nbsp; v = 2πr/T</div>`, fig:'circle'},
  {h:'"Centripetal" is a job, not a force', body:`<p>The net force toward the center is ΣF = mv²/r. Some real force does that job: tension, gravity, friction, or normal force. Never draw a separate "centripetal force" arrow.</p><p>At the top of a loop, gravity and the normal force both point down: F<sub>N</sub> + mg = mv²/r. The slowest you can go is when F<sub>N</sub> = 0, giving <span class="eq">v = √(gr)</span>.</p>`, fig:'loop'},
 ],
 qs:[
  {t:'mc', q:'You swing a ball on a string in a horizontal circle and the string snaps. Which way does the ball go?', c:['Straight along the tangent','Straight outward from the center','Along the curve for a while','Straight toward the center'], a:0, why:'With the inward force gone, there\'s no net force sideways (first law), so it moves in a straight line in the direction it was going.'},
  {t:'num', q:'A 1000 kg car takes a flat curve of radius 50 m at 20 m/s. How much friction force must the road supply?', a:8000, unit:'N', why:'F = mv²/r = 1000 × 400 / 50 = 8000 N, pointed toward the curve\'s center. That\'s static friction.'},
  {t:'mc', q:'How should "centripetal force" appear on a free-body diagram?', c:['It shouldn\'t; label the real force doing the job','As an arrow toward the center','As an arrow away from the center','As a dashed arrow'], a:0, why:'It\'s the name for the net inward force, not a new interaction. Label tension, gravity, friction, or normal.'},
  {t:'num', q:'What is the minimum speed at the top of a loop with radius 2.5 m? (g = 9.8 m/s²)', a:4.95, unit:'m/s', why:'At minimum speed F_N = 0, so mg = mv²/r and v = √(9.8 × 2.5) ≈ 4.95 m/s.'},
  {t:'fbd', q:'A roller coaster car is upside down at the top of a loop. Pick every force on the car.', f:[F('g','Gravity','F_g',-90,1),F('n','Normal from the track','F_N',-90,1),F('nu','Normal pointing up','F_N',90,0),F('c','Centripetal force','F_c',-90,0),F('m','Force of motion (forward)','F_m',0,0)], why:'Both gravity and the track push toward the center, which is downward here. Together they provide mv²/r. There\'s no extra centripetal force.'},
  {t:'tiles', q:'Build the top-of-loop equation (toward the center is positive).', tiles:['F_N','+','mg','=','mv²/r','−','ma'], ans:['F_N','+','mg','=','mv²/r'], why:'Both forces point toward the center, so they add to give the required mv²/r.'},
  {t:'num', q:'A 0.2 kg stone on a 0.5 m string makes one horizontal circle every 0.5 s. Find the string tension. (Ignore gravity\'s sag.)', a:15.8, unit:'N', why:'v = 2πr/T = 2π(0.5)/0.5 ≈ 6.28 m/s. T = mv²/r = 0.2 × 39.5 / 0.5 ≈ 15.8 N.'},
  {t:'mc', q:'A car drives through the bottom of a dip in the road. Compared with mg, the normal force on the car is…', c:['Greater','Less','Equal','Zero'], a:0, why:'The center is above you, so the net force must point up: F_N − mg = mv²/r. That makes F_N > mg, and you feel heavier.'},
 ]},

{id:'boss-loop', kind:'boss', title:'FRQ: The loop-the-loop track', year:'2024', qnum:'Q1 (b–c)', src:SRC.y24,
 intro:`<p>A block of mass M is released from rest at a height of <b>6R</b> and slides down a frictionless track with two circular loops of radius <b>R</b>. Point B is the top of the first loop, at a height of <b>2R</b>. Point C is the top of the second loop. The block never leaves the track.</p>`,
 steps:[
  {t:'mc', q:'Using conservation of energy, what is the block\'s speed at Point B?', c:['√(8gR)','√(12gR)','√(4gR)','√(2gR)'], a:0, why:'Mg(6R) = Mg(2R) + ½Mv², so v² = 8gR and v = √(8gR).'},
  {t:'fbd', q:'Draw the forces on the block as it slides through the top of a loop (Point C).', f:[F('g','Gravity','F_g',-90,1),F('n','Normal from the track','F_N',-90,1),F('nu','Normal pointing up','F_N',90,0),F('c','Centripetal force','F_c',-90,0),F('fw','Force of motion (forward)','F_m',0,0)], why:'Only two forces, both pointing down toward the loop\'s center. No centripetal arrow and no forward force.'},
  {t:'mc', q:'A student claims 4R is the minimum release height for the block to get through Point C without losing contact. What condition actually sets the minimum?', c:['At C, the normal force drops to zero so gravity alone provides mv²/R','At C, the speed must be zero','At C, the normal force equals mg','The block must have zero potential energy at C'], a:0, why:'Losing contact means F_N would have to go negative. The limit is F_N = 0, where mg = mv²/R, so v² = gR. A speed of zero at the top would mean it had already fallen off.'},
  {t:'num', q:'Extend it: if C is also 2R high, what is the true minimum release height, in units of R?', a:2.5, tol:0.02, unit:'× R', why:'Mgh = Mg(2R) + ½M(gR) gives h = 2.5R. So 4R is more than needed; the claim gets the minimum wrong.'},
 ],
 model:`<p><b>(b)</b> Mg(6R) = Mg(2R) + ½Mv<sub>B</sub>², so v<sub>B</sub> = √(8gR).</p><p><b>(c)(i)</b> Two downward arrows on the dot: F<sub>g</sub> and F<sub>N</sub> (the track pushes toward the center).</p><p><b>(c)(ii)</b> The block only needs F<sub>N</sub> ≥ 0 at C, which means v<sub>C</sub>² ≥ gR. That requires a release height lower than 4R, so 4R isn\'t the minimum. Compare your wording with the scoring guidelines.</p>`},

{id:'boss-final', kind:'boss', title:'Final FRQ: The rising block', year:'2025', qnum:'Q4', src:SRC.y25,
 intro:`<p>A swimmer holds a block of mass m at rest underwater, then lets go. The block <b>accelerates upward</b>. Friction is negligible.</p><p>Scenario 1: fresh water, density ρ₁, initial acceleration a₁. Scenario 2: salt water, density ρ₂ &gt; ρ₁, initial acceleration a₂.</p><p>New tool: water pushes up with a <b>buoyant force</b> F<sub>B</sub> = ρVg, where V is the block\'s volume. Everything else is Newton\'s second law.</p>`,
 steps:[
  {t:'fbd', q:'Pick every force on the block just after it is released.', f:[F('g','Gravity','F_g',-90,1),F('b','Buoyant force from water','F_B',90,1),F('h','Swimmer\'s hand','F_hand',90,0),F('n','Normal force','F_N',90,0)], why:'The hand let go, so it exerts nothing. Gravity pulls down; the water pushes up with the buoyant force.'},
  {t:'mc', q:'Compare a₁ (fresh water) with a₂ (salt water).', c:['a₁ < a₂','a₁ > a₂','a₁ = a₂','Can\'t tell'], a:0, why:'Gravity is the same in both. Salt water is denser, so its buoyant force is larger, giving a bigger upward net force on the same mass.'},
  {t:'mc', q:'Starting from Newton\'s second law, derive the initial upward acceleration in terms of m, V, ρ, and g.', c:['a = (ρVg − mg) / m','a = (mg − ρVg) / m','a = ρVg / m','a = (ρV − m)g / V'], a:0, why:'Up is positive: ΣF = F_B − F_g = ρVg − mg = ma. Divide by m.'},
  {t:'mc', q:'Is your expression consistent with your answer comparing a₁ and a₂?', c:['Yes: a increases as ρ increases','No: a decreases as ρ increases','No: a doesn\'t depend on ρ','Only if V changes'], a:0, why:'In a = ρVg/m − g, ρ appears in a positive term. Bigger ρ gives bigger a, matching a₂ > a₁.'},
 ],
 model:`<p><b>(A)</b> a₁ &lt; a₂. The gravitational force on the block is the same in both tanks. The buoyant force is larger in the denser salt water, so the upward net force, and the acceleration, is larger.</p><p><b>(B)</b> ρVg − mg = ma, so a = (ρVg − mg)/m.</p><p><b>(C)</b> Consistent: a grows with ρ, and ρ₂ &gt; ρ₁.</p><p>Notice the prompt asks for "ALL forces" in part A. Name both gravity and buoyancy.</p>`},
];

const CLASS = [
{id:'c-fric', kind:'lesson', tag:'Class notes', title:'Friction: notes & classwork', topic:'coefficient of friction',
 learn:[
  {h:'Where friction comes from', body:`<p>Zoom in far enough and even smooth surfaces are jagged "mountains." They only touch at a few <b>contact points</b>, and those points interlock. That\'s where friction acts.</p><p>Rougher surfaces have bigger mountains, so more friction. It depends on the texture of <b>both</b> surfaces, which is also why friction lab results bounce around.</p>`},
  {h:'What sets the size', body:`<p>The real factor isn\'t weight, it\'s how hard the surfaces are <b>pressed together</b>: the normal force. Lab results show F<sub>f</sub> ∝ F<sub>N</sub>, so</p><div class="eqblock">F<sub>f</sub> = μF<sub>N</sub></div><p>μ has no units (it\'s a ratio of two forces). Contact area doesn\'t matter: double the area and each square centimeter gets half the push.</p>`},
  {h:'Two coefficients', body:`<p><b>Already moving:</b> F<sub>f</sub> = μ<sub>k</sub>F<sub>N</sub>. <b>Not moving yet:</b> F<sub>f</sub> ≤ μ<sub>s</sub>F<sub>N</sub>, where μ<sub>s</sub>F<sub>N</sub> is the most it can be.</p><p>μ<sub>s</sub> is bigger because starting means lifting surface 1 up over the mountains of surface 2.</p><p><b>Your teacher\'s warning:</b> things don\'t stay put because of inertia. Without friction, even an elephant accelerates when you push it, just slowly.</p>`},
 ],
 qs:[
  {t:'num', q:'It takes 0.8 N to just start a 2.5 N block moving across the bench. Find μs.', a:0.32, unit:'', why:'μs = Ff / FN = 0.8 / 2.5 = 0.32. No units, since it\'s a ratio of two forces.'},
  {t:'num', q:'A similar block weighing 4.5 N sits on the same bench. What force just starts it moving?', a:1.44, unit:'N', why:'F = μs·FN = 0.32 × 4.5 = 1.44 N.'},
  {t:'tf', q:'Doubling a block\'s contact area doubles the friction on it.', a:false, why:'More area means each square centimeter is pressed down half as hard, so the total friction stays about the same.'},
  {t:'mc', q:'What actually sets the size of the friction force?', c:['How hard the surfaces press together (the normal force)','The object\'s weight, in every situation','The contact area','How fast it slides'], a:0, why:'Weight only matters because on flat ground it sets the normal force. Push down on a block, or tilt the surface, and FN changes.'},
  {t:'mc', q:'You gently push a heavy crate and it doesn\'t move. Why?', c:['Static friction matches your push','Its inertia is too big to accelerate','Heavy objects need a minimum force to move','Gravity holds it back horizontally'], a:0, why:'This is the warning from your notes. On a frictionless floor any push would accelerate it, just slowly.'},
  {t:'mc', q:'Why is μs usually bigger than μk?', c:['Starting means lifting over the surface "mountains"; once moving it skims across them','Moving objects weigh less','Kinetic friction only acts at high speed','The normal force drops when moving'], a:0, why:'Your notes explain it with the interlocking contact points.'},
  {t:'num', ctx:CW1, q:'What horizontal force must be applied to get the block moving?', a:8, alt:7.84, unit:'N', why:'F = μs·mg = 0.40 × 2.0 × 10 = 8.0 N.'},
  {t:'num', ctx:CW1, q:'A 6.0 N horizontal force is applied. What is the friction force?', a:6, unit:'N', why:'6.0 N is less than the 8.0 N maximum, so the block stays put and static friction just matches the push: 6.0 N.'},
  {t:'num', ctx:CW2, q:'Find μk for the pair of surfaces.', a:0.156, alt:0.159, tol:0.04, unit:'', why:'v² = 2ad gives a = 25 / 16 = 1.56 m/s². Friction is the only horizontal force, so μk·g = a and μk = 1.56 / 10 ≈ 0.16.'},
 ]},

{id:'c-hw', kind:'lesson', tag:'Homework', title:'Friction homework set',
 qs:[
  {t:'num', ctx:'<b>1.</b> Abe weighs 420 N and steps in spilled water. μk drops to 0.040.', q:'What is the friction force between Abe and the slippery floor?', a:16.8, unit:'N', why:'F = μk·FN = 0.040 × 420 = 16.8 N. His weight is already in newtons, so no g needed.'},
  {t:'num', ctx:'<b>2.</b> Kitty pushes an 82 kg cabinet at steady speed. The floor resists with 320 N of friction.', q:'Find μk between cabinet and floor.', a:0.39, alt:0.398, unit:'', why:'μk = 320 / (82 × 10) = 0.39.'},
  {t:'num', ctx:'<b>3.</b> Casey (30 kg) slides across a waxed floor in socks. μk = 0.12.', q:'What friction force opposes Casey\'s motion?', a:36, alt:35.3, unit:'N', why:'F = 0.12 × 30 × 10 = 36 N.'},
  {t:'num', ctx:'<b>4.</b> Ryan pulls his 70 kg dog across the floor. μs = 0.50.', q:'(A) What friction force must Ryan overcome?', a:350, alt:343, unit:'N', why:'Max static friction = 0.50 × 70 × 10 = 350 N.'},
  {t:'num', ctx:'<b>4.</b> Ryan pulls his 70 kg dog across the floor. μs = 0.50.', q:'(B) Ryan pulls with 400 N. What is the net force on the dog?', a:50, alt:57, unit:'N', why:'400 − 350 = 50 N. (Like the sheet, this assumes friction stays at 350 N once the dog slides.)'},
  {t:'num', ctx:'<b>4.</b> Ryan pulls his 70 kg dog across the floor. μs = 0.50.', q:'(C) What is the dog\'s acceleration?', a:0.714, alt:0.814, unit:'m/s²', why:'a = 50 / 70 ≈ 0.71 m/s².'},
  {t:'num', ctx:'<b>5.</b> A 5.5 kg watermelon on a friction-free table accelerates at 4.2 m/s² from a nose push.', q:'Find the horizontal force from the nose.', a:23.1, unit:'N', why:'No friction, so the nose is the net force: F = ma = 5.5 × 4.2 = 23.1 N.'},
  {t:'num', ctx:'<b>6.</b> A 25 kg chair needs 65 N to start moving and 27 N to keep moving at constant velocity.', q:'Find μs.', a:0.26, alt:0.265, unit:'', why:'μs = 65 / (25 × 10) = 0.26.'},
  {t:'num', ctx:'<b>6.</b> A 25 kg chair needs 65 N to start moving and 27 N to keep moving at constant velocity.', q:'Find μk.', a:0.108, alt:0.110, unit:'', why:'Constant velocity means friction = 27 N, so μk = 27 / 250 ≈ 0.11.'},
  {t:'num', ctx:'<b>7.</b> A 1254 kg sports car starts from rest with a 4400 N driving force against 280 N of friction.', q:'(a) What acceleration is produced?', a:3.29, unit:'m/s²', why:'a = (4400 − 280) / 1254 ≈ 3.29 m/s².'},
  {t:'num', ctx:'<b>7.</b> A 1254 kg sports car starts from rest with a 4400 N driving force against 280 N of friction.', q:'(b) How far does it go in 9 s?', a:133, unit:'m', why:'d = ½at² = ½ × 3.29 × 81 ≈ 133 m.'},
 ]},

{id:'c-incline', kind:'boss', badge:'MAX', tag:'Challenge problem', title:'The 18° slope',
 intro:`<p>A student measures a <b>50.0 kg</b> block sliding down an <b>18°</b> slope at a <b>constant velocity</b> of 0.50 m/s. This one is all about what constant velocity tells you.</p><div class="fig">${FIG.incline18}</div>`,
 steps:[
  {t:'fbd', q:'Pick every force on the sliding block.', f:[F('g','Gravity','F_g',-90,1),F('n','Normal, perpendicular to slope','F_N',72,1),F('fu','Friction up the slope','F_f',162,1),F('fd','Friction down the slope','F_f',-18,0),F('m','Force of motion down the slope','F_m',-18,0)], why:'Gravity, normal, and kinetic friction pointing up the slope (opposite the sliding).'},
  {t:'mc', q:'What does "constant velocity" tell you?', c:['Friction exactly balances gravity\'s pull down the slope','There is no friction','Gravity has no component along the slope','The net force points down the slope'], a:0, why:'Constant velocity means ΣF = 0 along the slope: μk·mg·cosθ = mg·sinθ.'},
  {t:'num', q:'(a) Find μk.', a:0.325, unit:'', why:'μk·mg·cosθ = mg·sinθ, so μk = tan 18° ≈ 0.32. The mass cancels.'},
  {t:'mc', q:'(b) A student says pushing down on the block, perpendicular to the slope, will stop it. Agree?', c:['Agree: more normal force means more friction than gravity\'s pull, so it slows and stops','Disagree: a perpendicular push changes nothing along the slope','Disagree: it will speed up','Agree: pushing cancels gravity'], a:0, why:'Pushing in raises FN, which raises friction. Gravity\'s component along the slope doesn\'t change, so the net force now points up the slope and the block decelerates.'},
  {t:'mc', q:'(c) He says adding masses on top will stop it. Agree?', c:['Disagree: extra mass raises gravity\'s pull and friction by the same factor, so it keeps a constant velocity','Agree: more weight means more friction','Agree: heavier things slow down','Disagree: it will speed up'], a:0, why:'Both mg·sinθ and μk·mg·cosθ scale with m. They stay balanced.'},
  {t:'mc', q:'(d) A third student tilts the slope up from flat until the block just starts to slide. Bigger or smaller than 18°?', c:['Bigger, because μs > μk','Smaller','Exactly 18°','It never starts'], a:0, why:'Starting from rest needs tanθ = μs, and μs is usually greater than μk = tan 18°.'},
  {t:'mc', q:'(e) Once it starts moving in her experiment, does it go at constant velocity?', c:['No, it accelerates: kinetic friction is smaller than the static friction that was holding it','Yes, constant velocity','It stops again right away','It slides back up'], a:0, why:'At that steeper angle, gravity\'s pull down the slope beats kinetic friction, so there\'s a net force down the slope.'},
 ],
 model:`<p><b>(a)</b> μ<sub>k</sub> = tan 18° ≈ 0.32. <b>(b)</b> Agree: a bigger F<sub>N</sub> means more friction, so the net force points up the slope and the block stops. <b>(c)</b> Disagree: both forces scale with mass, so the velocity stays constant. <b>(d)</b> Bigger than 18°, since μ<sub>s</sub> &gt; μ<sub>k</sub>. <b>(e)</b> It accelerates, because kinetic friction is less than the static friction it just broke free from.</p>`},

{id:'c-joined', kind:'lesson', tag:'Worksheet', title:'Joined bodies (pulleys)', topic:'Atwood machine pulley',
 learn:[
  {h:'One system, then isolate', body:`<p>Connected blocks share one acceleration. Treat them as one system: only <b>external</b> forces count, and the string tension is internal.</p><div class="eqblock">a = (net external force) / (total mass)</div><p>Then find the tension by drawing one block alone, where tension <b>is</b> external.</p>`, fig:'pulleyTable'},
  {h:'Two hanging masses', body:`<p>The heavier side goes down. Gravity on each side fights the other:</p><div class="eqblock">a = (m<sub>A</sub> − m<sub>B</sub>)g / (m<sub>A</sub> + m<sub>B</sub>)</div><p>The tension lands between the two weights: bigger than the light one\'s, smaller than the heavy one\'s.</p>`, fig:'atwood'},
 ],

  {t:'tiles', ctx:J1, fig:'pulleyTable', q:'Treat both blocks as one system. Build the equation for a.', tiles:['2.0g','=','(10 + 2.0)a','10a','−','T'], ans:['2.0g','=','(10 + 2.0)a'], why:'The only external force along the string direction is the hanging block\'s weight. It accelerates all 12 kg.'},
  {t:'num', ctx:J1, fig:'pulleyTable', q:'(a) Find the acceleration of the system.', a:1.67, alt:1.63, unit:'m/s²', why:'a = (2.0 × 10) / 12 ≈ 1.67 m/s².'},

  {t:'mc', ctx:J1, q:'How does that tension compare with the hanging block\'s 20 N weight?', c:['Smaller, because the hanging block accelerates downward','Equal','Bigger','Zero'], a:0, why:'If T equaled 20 N the hanging block would have zero net force. It speeds up downward, so T < mg.'},
  {t:'num', ctx:J2, fig:'atwood', q:'(a) Find the acceleration of the system.', a:1.43, alt:1.40, unit:'m/s²', why:'a = (3.2 − 2.4) × 10 / 5.6 ≈ 1.43 m/s². A goes down.'},
  {t:'num', ctx:J2, fig:'atwood', q:'(b) Find the tension in the string.', a:27.4, alt:26.9, unit:'N', why:'On B (accelerating up): T − mg = ma, so T = 2.4 × (10 + 1.43) ≈ 27.4 N. Check: it\'s between B\'s weight (24 N) and A\'s (32 N).'},
  {t:'num', ctx:J2, fig:'atwood', q:'(c) A is released from rest 0.5 m above the floor. How fast is it going just before it lands?', a:1.2, alt:1.18, unit:'m/s', why:'v² = 2ad = 2 × 1.43 × 0.5, so v ≈ 1.2 m/s.'},
  {t:'num', ctx:'<b>Problem set 5.</b> A 5 kg block and a 3 kg block hang over a pulley and are released.', q:'(a) Find the acceleration.', a:2.5, alt:2.45, unit:'m/s²', why:'a = (5 − 3) × 10 / 8 = 2.5 m/s².'},

 ]},

{id:'c-sys', kind:'lesson', tag:'Problem set', title:'Newton\'s 3rd law & systems', topic:'Newton\'s third law systems of objects',
 learn:[
  {h:'Pushes passed down a line', body:`<p>When blocks push each other, M₁ pushes M₂ and M₂ pushes back on M₁ just as hard. That\'s a 3rd law pair.</p><p>Each contact force only has to accelerate the blocks <b>ahead</b> of it, so the forces shrink down the line: F<sub>1 on 2</sub> moves M₂ + M₃, but F<sub>2 on 3</sub> only moves M₃.</p>`, fig:'blocks3'},
  {h:'Strings work the same way', body:`<p>A string\'s tension accelerates everything <b>behind</b> it. Use the whole train for a, then pick the blocks behind a string to find its tension.</p><p>With friction, check first whether the pull beats the total friction. If it does: a = (pull − total friction) / total mass.</p>`, fig:'train'},
 ],
 qs:[

  {t:'num', ctx:B3, fig:'blocks3', q:'(iii) Find the force M₂ puts on M₃.', a:10, unit:'N', why:'It only has to accelerate M₃: 5 × 2 = 10 N.'},

  {t:'num', ctx:TR, fig:'train', q:'Find the acceleration of the system.', a:0.571, unit:'m/s²', why:'a = 20 / (20 + 10 + 5) ≈ 0.57 m/s².'},
