  {t:'num', ctx:ST, fig:'stack', q:'(a) Find the acceleration of the blocks.', a:0.714, unit:'m/s²', why:'Both move together: a = (20 − 15) / 7 ≈ 0.71 m/s².'},
  {t:'num', ctx:ST, fig:'stack', q:'(b) What friction force must act between the two blocks?', a:1.43, unit:'N', why:'Friction is the only horizontal force on the 2 kg block: F = 2 × 0.714 ≈ 1.43 N.'},
  {t:'mc', ctx:ST, q:'Which way does friction from the bottom block push the top block?', c:['Forward (right): it\'s what accelerates the top block','Backward (left)','Downward','There is none'], a:0, why:'The top block speeds up to the right, so the force on it must point right. Its 3rd law partner pushes the bottom block left.'},
 ]},

{id:'c-elev', kind:'lesson', tag:'Worksheet', title:'Elevators & apparent weight', topic:'elevator apparent weight',
 learn:[
  {h:'The cable', body:`<p>Up is positive. Two forces act on the elevator: tension up, gravity down.</p><div class="eqblock">T − mg = ma &nbsp;→&nbsp; T = m(g + a)</div><p>At rest or at <b>any</b> constant speed, a = 0 and T = mg.</p>`},
  {h:'How heavy you feel', body:`<p>You judge your weight by the floor pushing on your feet: the <b>normal force</b>. A bathroom scale reads exactly that.</p><div class="eqblock">F<sub>N</sub> = m(g + a)</div><p>Accelerating up: you feel heavier. Accelerating down: lighter. Free fall (a = −g): weightless, F<sub>N</sub> = 0.</p>`},
 ],
 qs:[
  {t:'num', ctx:EL, q:'(a) What is the tension when the elevator is static?', a:10000, alt:9800, unit:'N', why:'a = 0, so T = mg = 1000 × 10 = 10,000 N.'},
  {t:'num', ctx:EL, q:'(b) Accelerating up at 2 m/s²?', a:12000, alt:11800, unit:'N', why:'T = m(g + a) = 1000 × 12 = 12,000 N.'},
  {t:'num', ctx:EL, q:'(c) Accelerating down at 1 m/s²?', a:9000, alt:8800, unit:'N', why:'a = −1, so T = 1000 × (10 − 1) = 9,000 N.'},
  {t:'num', ctx:EL, q:'(d) Moving at a constant 3 m/s?', a:10000, alt:9800, unit:'N', why:'Constant speed means a = 0. The 3 m/s is a distractor: T = mg = 10,000 N.'},
  {t:'fbd', ctx:GL, q:'What are the 2 forces acting on her?', f:[F('g','Gravity from Earth','F_g',-90,1),F('n','Normal force from the floor','F_N',90,1),F('t','Tension from the cable','F_T',90,0),F('e','Force of the elevator moving','F_e',90,0)], why:'Only Earth and the floor act on her. The cable pulls the elevator, not her.'},
  {t:'num', ctx:GL, q:'(a) Normal force when the elevator is static?', a:500, alt:490, unit:'N', why:'F_N = mg = 50 × 10 = 500 N.'},
  {t:'num', ctx:GL, q:'(b) Accelerating up at 2 m/s²?', a:600, alt:590, unit:'N', why:'F_N = 50 × (10 + 2) = 600 N.'},
  {t:'num', ctx:GL, q:'(c) Accelerating down at 1 m/s²?', a:450, alt:440, unit:'N', why:'F_N = 50 × (10 − 1) = 450 N.'},
  {t:'num', ctx:GL, q:'(d) In free fall (accelerating down at g)?', a:0, unit:'N', why:'F_N = 50 × (10 − 10) = 0. She feels weightless.'},
  {t:'mc', ctx:GL, q:'How do answers (a)–(d) match what you feel in an elevator?', c:['Heavier speeding up going up, lighter when accelerating down, weightless in free fall','You always feel the same, since gravity doesn\'t change','Heavier whenever the elevator moves down','Lighter whenever it moves fast'], a:0, why:'You feel the normal force, and it changes with acceleration, not with velocity.'},
  {t:'tf', q:'Riding down at a constant speed, you feel lighter than normal.', a:false, why:'Constant speed means a = 0, so F_N = mg. You only feel lighter while the elevator is accelerating downward (like when it starts going down).'},
 ]},

{id:'c-elevap', kind:'boss', tag:'AP question', title:'The elevator a–t graph',
 intro:`<p>A student of mass m stands on a platform scale in an elevator. Up is positive. An inspector gives the student this graph of the elevator\'s acceleration over time (redrawn from your worksheet, values approximate):</p><div class="fig">${FIG.elevGraph}</div>`,
 steps:[
  {t:'fbd', q:'(a) Draw a free-body diagram for the student.', f:[F('g','Gravity','F_g',-90,1),F('n','Normal force from the scale','F_N',90,1),F('ma','Net force "ma"','ma',90,0),F('e','Force of the elevator moving','F_e',90,0)], why:'Two forces: gravity down, the scale pushing up. Never draw ma as a force.'},
  {t:'mc', q:'(b) Derive the scale reading in terms of a, m, and g.', c:['F_N = m(g + a)','F_N = m(g − a)','F_N = ma','F_N = mg'], a:0, why:'Up positive: F_N − mg = ma, so F_N = m(g + a). It works for negative a too.'},
  {t:'mc', q:'(i) During what interval is the scale\'s force on the student greatest?', c:['About 12 s to 16 s','About 2 s to 4 s','About 7 s to 10 s','About 17 s to 20 s'], a:0, why:'F_N = m(g + a) is largest when a is the most positive: the +1.2 m/s² plateau.'},
  {t:'num', q:'(ii) Calculate that maximum force for a 45 kg student. Read a ≈ 1.2 m/s² from the graph.', a:504, alt:495, unit:'N', why:'F_N = 45 × (10 + 1.2) ≈ 504 N (495 N with g = 9.8).'},
  {t:'mc', q:'During what interval(s) is the elevator\'s speed constant?', c:['When a = 0: about 7–10 s and 17–20 s','About 12–16 s, where the graph is flat','About 2–4 s, where the graph is flat','Never'], a:0, why:'Constant speed means zero acceleration. A flat line at 1.2 m/s² still means speeding up. This trap catches lots of people.'},
 ],
 model:`<p><b>(a)</b> Dot with F<sub>g</sub> down and F<sub>N</sub> (from the scale) up. <b>(b)</b> F<sub>N</sub> − mg = ma, so F<sub>N</sub> = m(g + a). <b>(i)</b> The largest positive a: about 12–16 s. <b>(ii)</b> 45(10 + 1.2) ≈ 500 N. <b>(c)</b> Speed is constant only where a = 0, about 7–10 s and 17–20 s.</p>`},
];

/* ---------- from your class: practice FRQ packets ---------- */
const FAN=`<b>Fan-block.</b> A block has a fan on a pivot, so the fan\'s angle θ above horizontal can be set from 0° to 90°. At θ = 0 the block speeds up along the track even though there\'s friction.`;
const posOK=mini([{f:x=>0.5+0.45*x*x,c:'field',l:'m₁'},{f:x=>0.5-0.5*x*x,c:'force',l:'m₂'}],'t','y');
const posLin=mini([{f:x=>0.5+0.45*x,c:'field',l:'m₁'},{f:x=>0.5-0.5*x,c:'force',l:'m₂'}],'t','y');
const posBad=mini([{f:x=>0.5+0.9*x-0.45*x*x,c:'field',l:'m₁'},{f:x=>0.5-x+0.5*x*x,c:'force',l:'m₂'}],'t','y');
const posDown=mini([{f:x=>0.5-0.25*x*x,c:'field',l:'m₁'},{f:x=>0.5-0.5*x*x,c:'force',l:'m₂'}],'t','y');
const wCos=mini([{f:x=>0.92*Math.cos(x*Math.PI/2),c:'force'}],'θ','W');
const wLin=mini([{f:x=>0.92*(1-x),c:'force'}],'θ','W');
const wFlat=mini([{f:x=>0.6,c:'force'}],'θ','W');
const wUp=mini([{f:x=>0.92*Math.sin(x*Math.PI/2),c:'force'}],'θ','W');
const FRQS = [
{id:'p-angles', kind:'lesson', tag:'Forces at angles', title:'Angled forces & components', topic:'forces at an angle components',
 learn:[
  {h:'Split it into components', body:`<p>A force F at angle θ above the horizontal does two jobs at once:</p><div class="eqblock">F<sub>x</sub> = F cosθ &nbsp;&nbsp; F<sub>y</sub> = F sinθ</div><p>On a free-body diagram, draw the <b>one angled arrow</b>. Components only belong in your math.</p>`, fig:'fanBlock'},
  {h:'Angles change the normal force', body:`<p>Tilt a force upward and it lifts part of the weight, so the surface pushes less:</p><div class="eqblock">F<sub>N</sub> = mg − F sinθ</div><p>Less F<sub>N</sub> means less friction. Push down at an angle and F<sub>N</sub> = mg + F sinθ instead.</p><p>A force only does work with the part along the motion: <span class="eq">W = Fd cosθ</span>.</p>`},
 ],
 qs:[
  {t:'num', q:'A rope pulls with 20 N at 30° above the horizontal. Find the horizontal component.', a:17.3, unit:'N', why:'Fx = 20 cos 30° ≈ 17.3 N.'},
  {t:'num', q:'Same rope: find the vertical component.', a:10, unit:'N', why:'Fy = 20 sin 30° = 10 N.'},
  {t:'mc', q:'You pull a sled with a rope angled upward. Compared with mg, the normal force on the sled is…', c:['Smaller','Larger','Equal','Zero'], a:0, why:'The rope\'s upward component holds up part of the weight, so the snow pushes less: F_N = mg − F sinθ.'},
  {t:'fbd', q:'A sled is pulled across snow by a rope angled 30° upward, with friction. Pick every force on the sled.', f:[F('g','Gravity','F_g',-90,1),F('n','Normal from snow','F_N',90,1),F('t','Tension along the rope (30° up)','F_T',30,1),F('fr','Kinetic friction','F_f',180,1),F('th','Horizontal part of tension','F_Tx',0,0)], why:'Draw the tension once, along the rope. Its components aren\'t separate forces.'},
  {t:'num', ctx:'A 0.50 kg fan-block has its fan at θ = 30°, giving a 2.0 N force. μk = 0.20.', fig:'fanBlock', q:'Find the normal force on the block.', a:4.0, alt:3.9, unit:'N', why:'F_N = mg − F sinθ = 5.0 − 2.0 × 0.5 = 4.0 N.'},
  {t:'num', ctx:'A 0.50 kg fan-block has its fan at θ = 30°, giving a 2.0 N force. μk = 0.20.', q:'Find the friction force.', a:0.8, alt:0.78, unit:'N', why:'f = μk·F_N = 0.20 × 4.0 = 0.80 N.'},
  {t:'num', ctx:'A 0.50 kg fan-block has its fan at θ = 30°, giving a 2.0 N force. μk = 0.20.', q:'Find the block\'s acceleration.', a:1.86, alt:1.90, unit:'m/s²', why:'a = (F cosθ − f) / m = (1.73 − 0.80) / 0.50 ≈ 1.86 m/s².'},
  {t:'mc', q:'The fan is turned to θ = 90° (straight up) and the block stays on the track. What does the fan do now?', c:['Only reduces the normal force; no push along the track','Pushes the block forward at full strength','Increases friction','Nothing at all'], a:0, why:'cos 90° = 0, so there\'s no horizontal push. sin 90° = 1, so it lifts with its full force.'},
  {t:'num', q:'A 2.0 N force acts at 60° to the direction of motion while an object moves 1.5 m. How much work does it do?', a:1.5, unit:'J', why:'W = Fd cosθ = 2.0 × 1.5 × cos 60° = 1.5 J.'},
 ]},

{id:'p-fan', kind:'boss', tag:'Practice FRQ', title:'The fan-block',
 intro:`<p>${FAN.replace(/<\/?b>/g,'')} The student has normal school lab equipment. Assume the air\'s force F on the fan is the same at every angle.</p><div class="fig">${FIG.fanBlock}</div>`,
 steps:[
  {t:'mc', ctx:'(a) Measure the force F the air exerts on the fan-block.', q:'Which method measures F without friction getting in the way?', c:['Point the fan straight up with the block on a scale; F = how much the reading drops when the fan turns on','Time the block along the track with the fan horizontal and use F = ma','Weigh the block with the fan off','Measure how fast the fan blades spin'], a:0, why:'At θ = 90° the air pushes straight up, so the scale reads mg − F. No friction is involved. (Putting it on a low-friction cart and using F = ma also works.)'},
  {t:'mc', ctx:'(b) Use the fan-block, fan on, to find μk with the track.', q:'Which measurements does the student need?', c:['Mass (balance), plus distance and time from rest (meterstick, stopwatch) with the fan at θ = 0','Only the mass','Only the time to cross the track','The fan angle and the fan speed'], a:0, why:'Distance and time from rest give the acceleration: a = 2d/t². Mass and F (from part a) then let you solve for friction.'},
  {t:'mc', q:'Which step reduces experimental uncertainty?', c:['Repeat several trials from rest, average the times, and use a long distance','Do one quick trial','Change the fan angle every trial','Start the block with a push'], a:0, why:'Averaging cuts random timing error, and a longer distance makes the reaction-time error a smaller fraction of t.'},
  {t:'fbd', ctx:'(b iv) The fan-block during that experiment: fan at θ = 0, block sliding right.', q:'Draw and label the forces on the fan-block system.', f:[F('g','Gravity','F_g',-90,1),F('n','Normal from track','F_N',90,1),F('f','Kinetic friction','F_f',180,1),F('air','Force from the air on the fan','F_air',0,1),F('m','Force of motion','F_m',0,0)], why:'Four forces. The air pushes the fan forward, so that arrow points the way it moves.'},
  {t:'mc', q:'(c) How should the data be analyzed to get μk?', c:['μk = (F − ma) / (mg), with a = 2d/t²','μk = (F + ma) / (mg)','μk = ma / (mg)','μk = F / (mg)'], a:0, why:'Horizontally: F − μk·mg = ma, so μk = (F − ma)/(mg). Vertically F_N = mg because θ = 0.'},
  {t:'mc', html:true, ctx:'(d) Now the block rides on a low-friction cart. The system travels a fixed distance D at different angles θ.', q:'Which graph shows the work done by the air as a function of θ?', c:[wCos,wLin,wFlat,wUp], ansText:'A cosine curve: largest at 0°, falling to zero at 90°', a:0, why:'W = FD cosθ. It\'s flat near 0°, then drops faster, reaching zero at 90°. It isn\'t a straight line.'},
 ],
 model:`<p><b>(a)</b> Set the fan to 90° with the block on a scale. F equals the drop in the reading when the fan turns on (or use a low-friction cart and F = ma). <b>(b)</b> With θ = 0, measure the mass with a balance, then distance d and time t from rest with a meterstick and stopwatch. Repeat and average. FBD: F<sub>g</sub>, F<sub>N</sub>, F<sub>f</sub> backward, F<sub>air</sub> forward. <b>(c)</b> a = 2d/t², then μ<sub>k</sub> = (F − ma)/(mg). <b>(d)</b> W = FD cosθ: a cosine curve from FD at 0° down to 0 at 90°.</p>`},

{id:'p-4h', kind:'boss', tag:'Practice FRQ', title:'Two blocks, one string of length 4h',
 intro:`<p>Blocks A and B each have mass m and are tied together by a string of length <b>4h</b>. A sits on a <b>smooth</b> table that is <b>2h</b> high. B hangs over the edge and is released from rest at time t = 0, a height <b>h</b> above the floor. Give answers in terms of h, m, and g.</p><div class="fig">${FIG.fourH}</div>`,
 steps:[
  {t:'mc', q:'(a) What is the acceleration of B as it falls?', c:['g/2','g','g/4','2g'], a:0, why:'System of both blocks: the only external pull along the string is B\'s weight mg, and it accelerates 2m. a = mg/2m = g/2.'},
  {t:'mc', q:'(b) At what time t₁ does B hit the floor?', c:['2√(h/g)','√(2h/g)','√(h/g)','4√(h/g)'], a:0, why:'h = ½(g/2)t₁², so t₁² = 4h/g and t₁ = 2√(h/g).'},
  {t:'mc', q:'(c) Describe A\'s motion from t = 0 until B lands.', c:['Speeds up toward the edge with a constant acceleration of g/2','Moves at constant velocity','Stays at rest','Slows down'], a:0, why:'The string pulls A with a constant tension, so A speeds up uniformly at g/2, just like B.'},
  {t:'mc', q:'(d) Describe A\'s motion after B lands, until A leaves the table.', c:['Constant speed √(gh): the string goes slack, so there\'s no horizontal force','Keeps speeding up at g/2','Slows to a stop from friction','Speeds up at g'], a:0, why:'The table is smooth and the string is slack. First law: A keeps v = (g/2)·t₁ = √(gh).'},
  {t:'mc', q:'(e) How far apart do the two blocks land?', c:['2h','h','3h','4h'], a:0, why:'B lands right below the edge. A leaves the edge at √(gh) and falls 2h, which takes 2√(h/g). It travels √(gh) × 2√(h/g) = 2h sideways.'},
 ],
 model:`<p><b>(a)</b> a = g/2. <b>(b)</b> t<sub>1</sub> = 2√(h/g). <b>(c)</b> A speeds up uniformly toward the edge at g/2. <b>(d)</b> The string goes slack and the table is smooth, so A moves at a constant √(gh). <b>(e)</b> A becomes a projectile launched horizontally at √(gh) from height 2h. It lands 2h from the table, and B is directly below the edge, so they land 2h apart.</p>`},

{id:'p-jb1', kind:'boss', tag:'Joined bodies · Q1', title:'Measuring μk with a pulley',
 intro:`<p>A student wants the coefficient of kinetic friction between block 1 (mass m<sub>1</sub>) and a wooden table. Block 1 is tied over a pulley to hanging block 2 (mass m<sub>2</sub>). Normal lab equipment, but no electronic sensors.</p><div class="fig">${FIG.pulleyGen}</div>`,
 steps:[
  {t:'mc', q:'(a i) What should be measured, and with what?', c:['m₁ and m₂ (balance), plus drop height and fall time of m₂ (meterstick, stopwatch)','Only m₁ and m₂','Only the time','The string length and pulley size'], a:0, why:'The masses go into Newton\'s 2nd law. Height and time give the acceleration.'},
  {t:'mc', q:'(b) How do you get the acceleration from the data?', c:['Average the times, then use h = ½at² from rest: a = 2h/t²','a = h/t','a = g','Average the two masses'], a:0, why:'Released from rest, so h = ½at². Both blocks share this acceleration because they share the string.'},
  {t:'mc', q:'(c) Derive μk in terms of m₁, m₂, and a.', c:['μk = [m₂g − (m₁ + m₂)a] / (m₁g)','μk = [m₂g + (m₁ + m₂)a] / (m₁g)','μk = m₂ / m₁','μk = (m₂g − m₁a) / (m₂g)'], a:0, why:'Block 1: T − μk·m₁g = m₁a. Block 2: m₂g − T = m₂a. Add them: m₂g − μk·m₁g = (m₁ + m₂)a.'},
  {t:'mc', q:'(d) A large mass is stuck on top of block 1 and the experiment is repeated. What happens to μk?', c:['Stays the same: μ depends on the two surfaces, not on mass','Increases','Decreases','Depends on how fast it moves'], a:0, why:'Extra mass changes the friction force, but not the roughness of the surfaces, which is all μ measures.'},
  {t:'fbd', ctx:'(e) The string is cut while block 1 is sliding right.', q:'Forces on block 1 right after the cut:', f:[F('g','Gravity','F_g',-90,1),F('n','Normal from table','F_N',90,1),F('f','Kinetic friction','F_f',180,1),F('t','Tension','F_T',0,0),F('m','Force of motion','F_m',0,0)], why:'No more tension. It\'s still sliding, so kinetic friction still points backward.'},
  {t:'fbd', ctx:'(e) The string is cut while block 2 is falling.', q:'Forces on block 2 right after the cut:', f:[F('g','Gravity','F_g',-90,1),F('t','Tension','F_T',90,0),F('a','Air resistance','F_air',90,0)], why:'With the string cut, only gravity is left. It\'s in free fall.'},
 ],
 model:`<p><b>(a)</b> Measure m<sub>1</sub> and m<sub>2</sub> with a balance, and the drop height h and fall time t of block 2 with a meterstick and stopwatch. Repeat and average. <b>(b)</b> a = 2h/t². <b>(c)</b> μ<sub>k</sub> = [m<sub>2</sub>g − (m<sub>1</sub> + m<sub>2</sub>)a] / (m<sub>1</sub>g). <b>(d)</b> Stays the same. <b>(e)</b> Block 1: F<sub>g</sub>, F<sub>N</sub>, friction backward. Block 2: F<sub>g</sub> only.</p>`},

{id:'p-jb2', kind:'boss', tag:'Joined bodies · Q2', title:'Atwood machine: measuring g',
 intro:`<p>Two blocks hang on either side of a light, frictionless pulley, with <b>m<sub>1</sub> &lt; m<sub>2</sub></b>. They are released from rest with their centers at the same height h above the floor.</p><div class="fig">${FIG.atwoodEq}</div>`,
 steps:[
  {t:'mc', html:true, q:'(a) Which graph shows each block\'s height until m₂ hits the floor?', c:[posOK,posLin,posBad,posDown], ansText:'Two curves from h: m₁ curving up faster and faster, m₂ curving down to 0', a:0, why:'Both speed up from rest at the same constant acceleration, so position vs. time is a parabola. m₁ goes up (concave up) and m₂ goes down (concave down) by the same amount.'},
  {t:'mc', q:'(b) Derive the acceleration of block 1.', c:['a = (m₂ − m₁)g / (m₁ + m₂)','a = (m₂ + m₁)g / (m₂ − m₁)','a = m₂g / m₁','a = g'], a:0, why:'Whole system: net external force (m₂ − m₁)g acts on total mass m₁ + m₂. Tension is internal.'},
  {t:'mc', q:'(c) Both masses are doubled. The acceleration…', c:['Stays the same','Increases','Decreases','Doubles'], a:0, why:'The net force doubles and so does the total mass. The 2s cancel.'},
  {t:'mc', q:'(d) How could you use this setup to measure g?', c:['Measure both masses, the drop height h, and the time t for m₂ to land; a = 2h/t²; then g = a(m₁ + m₂)/(m₂ − m₁). Repeat and average.','Time one rotation of the pulley','Measure only the masses','Drop m₂ alone without the string'], a:0, why:'Rearranging part (b) gives g from the measured a and masses.'},
  {t:'num', ctx:'Try it with numbers: m₁ = 0.20 kg, m₂ = 0.25 kg. m₂ falls 1.0 m in an average of 1.35 s.', q:'What value of g does this give?', a:9.88, unit:'m/s²', why:'a = 2(1.0)/1.35² ≈ 1.10 m/s². g = 1.10 × 0.45 / 0.05 ≈ 9.9 m/s².'},
 ],
 model:`<p><b>(a)</b> Two parabolas starting at h: m<sub>1</sub> curving upward, m<sub>2</sub> curving down to the floor at t<sub>f</sub>. <b>(b)</b> a = (m<sub>2</sub> − m<sub>1</sub>)g/(m<sub>1</sub> + m<sub>2</sub>). <b>(c)</b> Stays the same, because the doubling cancels. <b>(d)</b> Measure the masses, the drop height, and the fall time over repeated trials. Find a = 2h/t², then solve for g.</p>`},

{id:'p-jb3', kind:'boss', tag:'Joined bodies · Q3', title:'Climbing the rope',
 intro:`<p>A light rope runs over a light, frictionless pulley. Student A (mass m<sub>A</sub>) stands on the ground holding one end. Student B (mass m<sub>B</sub> &lt; m<sub>A</sub>) hangs from the other end, then starts climbing with constant acceleration a upward.</p><div class="fig">${FIG.rope}</div>`,
 steps:[
  {t:'mc', q:'(a) Derive the tension in the rope.', c:['F_T = m_B(g + a)','F_T = m_B(g − a)','F_T = m_B a','F_T = m_A g'], a:0, why:'On B: F_T − m_B·g = m_B·a, so F_T = m_B(g + a). To accelerate up, B has to pull harder than its own weight.'},
  {t:'fbd', ctx:'Student A is still standing on the ground while B climbs.', q:'Pick every force on Student A.', f:[F('g','Gravity','F_g',-90,1),F('t','Tension from the rope','F_T',90,1),F('n','Normal from the floor','F_N',90,1),F('b','Force from Student B','F_B',-90,0)], why:'B only touches the rope. A feels the rope pulling up, the floor pushing up, and gravity.'},
  {t:'mc', q:'(b) When B starts climbing, how does the floor\'s force on A change?', c:['Decreases: tension pulls A up harder, so the floor pushes less','Increases','Stays the same','Becomes negative'], a:0, why:'A is still at rest: F_N + F_T = m_A·g. Tension goes from m_B·g up to m_B(g + a), so F_N drops by m_B·a.'},
  {t:'mc', q:'(c) B climbs even harder and A is lifted off the floor. Rank the forces on A.', c:['F_T > m_A g > F_N = 0','m_A g > F_T > F_N','F_T = m_A g > F_N','F_N > F_T > m_A g'], a:0, why:'Off the floor means no contact, so F_N = 0. A accelerates upward, so the net force points up and F_T must beat gravity.'},
  {t:'num', ctx:'With numbers: m_B = 50 kg climbs with a = 1.0 m/s².', q:'Find the tension.', a:550, alt:540, unit:'N', why:'F_T = 50 × (10 + 1) = 550 N.'},
  {t:'num', ctx:'With numbers: m_B = 50 kg climbs with a = 1.0 m/s², and m_A = 60 kg stays on the floor.', q:'Find the floor\'s normal force on A.', a:50, alt:48, unit:'N', why:'F_N = m_A·g − F_T = 600 − 550 = 50 N.'},
 ],
 model:`<p><b>(a)</b> F<sub>T</sub> = m<sub>B</sub>(g + a). <b>(b)</b> Decreases. A stays at rest, so F<sub>N</sub> = m<sub>A</sub>g − F<sub>T</sub>, and the tension went up. <b>(c)</b> F<sub>T</sub> &gt; m<sub>A</sub>g &gt; F<sub>N</sub>. Once A leaves the floor, the normal force is zero. A accelerates upward, so the net force is up and the tension must be bigger than A\'s weight.</p>`},

{id:'p-jb4', kind:'boss', tag:'Joined bodies · Q4', title:'Stacked blocks + a hanging weight',
 intro:`<p>Block B (M<sub>B</sub>) sits on block A (M<sub>A</sub>) on a table. A string from A runs over a frictionless pulley to hanging block C (M<sub>C</sub>). Table–A friction: μ<sub>sA</sub>, μ<sub>kA</sub>. A–B friction: μ<sub>sB</sub>, μ<sub>kB</sub>.</p><div class="fig">${FIG.stackHang}</div>`,
 steps:[
  {t:'mc', q:'(a i) C is at rest. What is the tension?', c:['M_C g','(M_A + M_B)g','M_C g − μ_sA(M_A + M_B)g','0'], a:0, why:'C has zero acceleration: F_T = M_C·g.'},
  {t:'mc', q:'(a ii) Still at rest. What is the friction force between A and the table?', c:['M_C g: static friction just matches the tension','μ_sA(M_A + M_B)g, always','μ_kA(M_A + M_B)g','0'], a:0, why:'Static friction is only as big as it needs to be. A + B is at rest, so friction balances the tension: f = M_C·g. μ_sA(M_A + M_B)g is the maximum, which you reach only right before slipping. (Your answer key writes the maximum. Ask your teacher if they meant "just about to slip.")'},
  {t:'mc', q:'(b) C now falls at constant speed. What is the friction between A and the table?', c:['μ_kA(M_A + M_B)g, and it also equals M_C g','μ_sA(M_A + M_B)g','μ_kA·M_A·g','0'], a:0, why:'Sliding means kinetic friction. B sits on A, so the table pushes up with (M_A + M_B)g. Constant speed also means this equals the tension, M_C·g.'},
  {t:'mc', q:'(c) C speeds up and all blocks move together. Find the acceleration.', c:['a = [M_C − μ_kA(M_A + M_B)]g / (M_A + M_B + M_C)','a = M_C g / (M_A + M_B + M_C)','a = [M_C − μ_kA M_A]g / (M_A + M_C)','a = (M_C − M_A − M_B)g / (M_A + M_B + M_C)'], a:0, why:'All three blocks as one system: C\'s weight drives it, table friction resists, and the friction between A and B is internal.'},
  {t:'fbd', ctx:'Blocks A and B accelerate to the right together.', q:'Pick every force on block B.', f:[F('g','Gravity','F_g',-90,1),F('n','Normal from A','F_N',90,1),F('f','Static friction from A (forward)','F_f',0,1),F('fb','Friction from A (backward)','F_f',180,0),F('t','Tension','F_T',0,0)], why:'The string isn\'t tied to B. The only thing that can speed B up is static friction from A, pointing forward.'},
  {t:'mc', q:'(d) As the system\'s acceleration increases, what happens to the friction between A and B?', c:['It grows (it equals M_B·a) until it reaches μ_sB·M_B·g; then B slips and friction drops to μ_kB·M_B·g','It stays the same','It shrinks right away','It\'s always zero'], a:0, why:'B needs F = M_B·a to keep up. Static friction can supply that only up to its maximum. Past that, B slides and kinetic friction (smaller) takes over.'},
 ],
 model:`<p><b>(a)</b> F<sub>T</sub> = M<sub>C</sub>g. Friction with the table = M<sub>C</sub>g (static, matching the tension, up to μ<sub>sA</sub>(M<sub>A</sub> + M<sub>B</sub>)g). <b>(b)</b> F<sub>T</sub> = M<sub>C</sub>g and f = μ<sub>kA</sub>(M<sub>A</sub> + M<sub>B</sub>)g. <b>(c)</b> a = [M<sub>C</sub> − μ<sub>kA</sub>(M<sub>A</sub> + M<sub>B</sub>)]g / (M<sub>A</sub> + M<sub>B</sub> + M<sub>C</sub>). <b>(d)</b> Friction on B rises with a (f = M<sub>B</sub>a) until it hits μ<sub>sB</sub>M<sub>B</sub>g. Then B slips, friction drops to the kinetic value, and B eventually slides off.</p>`},
];

const PUSH=`Two identical boxes of mass M sit on a floor with friction coefficient μ. Box 1 is <b>pushed</b> with force F₀ aimed θ <b>below</b> the horizontal. Box 2 is <b>pulled</b> with the same F₀ aimed θ <b>above</b> the horizontal.`;

{id:'m-angles', kind:'lesson', tag:'MCQ set 1', title:'Angled pushes & ramps',
 learn:[

 ],

  {t:'mc', ctx:PUSH, fig:'pushPull', q:'Which expression gives the acceleration of box 1 (the pushed box)?', c:['[F₀cosθ − μ(Mg + F₀sinθ)] / M','[F₀cosθ − μ(Mg − F₀sinθ)] / M','[F₀cosθ + μ(Mg + F₀sinθ)] / M','(F₀ − μMg) / M'], a:0, why:'Pushing down adds F₀sinθ to the normal force, so friction is μ(Mg + F₀sinθ). Check with θ = 0: you get (F₀ − μMg)/M, as expected.'},
  {t:'mc', ctx:PUSH, q:'Which expression gives the acceleration of box 2 (the pulled box)?', c:['[F₀cosθ − μ(Mg − F₀sinθ)] / M','[F₀cosθ − μ(Mg + F₀sinθ)] / M','[F₀cosθ + μ(Mg − F₀sinθ)] / M','[F₀sinθ − μMg] / M'], a:0, why:'Pulling up lifts part of the weight: F_N = Mg − F₀sinθ. Friction always subtracts from the forward push.'},
  {t:'mc', ctx:PUSH, q:'Which box has the larger friction force on it?', c:['Box 1, the pushed one','Box 2, the pulled one','They are equal','It depends on μ'], a:0, why:'Same μ, but box 1 is pressed harder into the floor (Mg + F₀sinθ vs Mg − F₀sinθ).'},
  {t:'mc', html:true, ctx:'Both boxes start with the same speed. The push on box 1 is just strong enough to keep it moving at constant speed.', q:'Which speed–time graph could show both boxes? (1 = pushed box, 2 = pulled box)', c:[sOK,sBoth,sFlat,sDrop], ansText:'Box 1 (push): flat line. Box 2 (pull): straight line rising from the same starting speed', a:0, why:'Box 1 has zero net force, so its speed stays constant. Box 2 has the same forward component but less friction, so it has a constant positive acceleration: a straight rising line.'},
  {t:'mc', ctx:RAMP, fig:'rampUp', q:'The box slides DOWN the ramp. Which equation gives its acceleration a?', c:['f − mg sinθ = ma','−f − mg sinθ = ma','mg sinθ − f = ma','mg cosθ − f = ma'], a:0, why:'Sliding down means friction points up the ramp (+x). Gravity\'s component points down the ramp (−x). The result a is negative, which is fine.'},
  {t:'mc', ctx:RAMP, fig:'rampUp', q:'The box is launched UP the ramp instead. Which equation applies while it slides up?', c:['−f − mg sinθ = ma','f − mg sinθ = ma','mg sinθ − f = ma','−f + mg sinθ = ma'], a:0, why:'Sliding up, friction now points down the ramp. Both forces along the ramp point in −x.'},

{id:'m-com', kind:'lesson', tag:'MCQ set 3', title:'Center of mass & 3rd law traps',

function pushCloud(){
  if(!REF) return; const body=JSON.stringify({...S,sound:undefined});

function merge(a,b){
  const o={...DEF,...a};
  o.xp=Math.max(a.xp||0,b.xp||0);
  o.done={...(b.done||{}),...(a.done||{})}; o.open={...(b.open||{}),...(a.open||{})};
  const lat=(b.last||'')>(a.last||'')?b:a; o.streak=lat.streak||0; o.last=lat.last||null;
  if(a.day===b.day) o.dayXp=Math.max(a.dayXp||0,b.dayXp||0); else {const d=(b.day||'')>(a.day||'')?b:a; o.day=d.day; o.dayXp=d.dayXp||0;}
  const nw=(b.updated||0)>(a.updated||0)?b:a; o.goal=nw.goal||50; o.skip=!!nw.skip; o.updated=nw.updated||0;
  o.onboarded=!!(a.onboarded||b.onboarded); o.miss=nw.miss||{};
  const pb=(b.place&&b.place.date)||0, pa=(a.place&&a.place.date)||0;
  if(pb>pa){o.place=b.place;o.focus=b.focus||[];} else {o.place=a.place;o.focus=a.focus||[];}
  return o;
}
async function initCloud(){

}

/* ---------- lesson runner ---------- */
let R=null, setupOpen=true;
function startNode(node){
  const steps=[];
  if(node.kind==='lesson'){
    (node.learn||[]).forEach(l=>steps.push({type:'learn',...l}));
    if(node.topic) steps.push({type:'video',topic:node.topic});
    node.qs.forEach(q=>steps.push({type:'q',...q}));
  }else if(node.kind==='placement'||node.kind==='jump'||node.kind==='practice'){
    if(node.intro) steps.push({type:'intro'});
    node.qs.forEach(q=>steps.push({type:'q',...q}));
  }else{
    steps.push({type:'intro'});
    node.steps.forEach(q=>steps.push({type:'q',...q}));
    steps.push({type:'model'});
  }
  const hearts=node.kind==='jump'?2:(node.kind==='placement'||node.kind==='practice')?Infinity:5;
  R={node,steps,i:0,hearts,mode:node.kind,answers:{},firstMiss:new Set(),miss:0,total:steps.filter(s=>s.type==='q').length,retried:new Set(),t0:Date.now()};
  const ov=h(`<div class="lesson" role="dialog" aria-label="${esc(node.title)}">
    <div class="wrap l-top"><button class="iconbtn" id="lx" aria-label="Quit lesson">${I.x}</button><div class="bar"><i id="lbar" style="width:0%"></i></div><div class="hearts" id="lh" ${hearts===Infinity?'hidden':''}>${I.heart}<span>${hearts}</span></div></div>
    <div class="l-body" id="lbody"></div><div class="l-foot" id="lfoot"></div></div>`);
  document.body.appendChild(ov);
  $('#lx').onclick=closeLesson;
  showStep();
}
function closeLesson(){const o=$('.lesson');if(o)o.remove();R=null;renderShell();}
function setBar(){$('#lbar').style.width=(100*R.i/R.steps.length)+'%';}

let cur=null; // current question controller
function showStep(){
  setBar();
  const s=R.steps[R.i], node=R.node, body=$('#lbody');

  if(s.type==='learn'){
    body.innerHTML=`<div class="wrap">${kick}<h2 class="qtitle">${s.h}</h2>
      <div class="newt-say">${newt('happy')}<div class="say prose">${s.body}</div></div>
      ${s.fig?`<div class="fig">${FIG[s.fig]}</div>`:''}</div>`;

  }else if(s.type==='video'){
    body.innerHTML=`<div class="wrap">${kick}<h2 class="qtitle">Watch it explained</h2>
      <div class="newt-say">${newt('wow')}<div class="say">Pick one, watch, then come back for practice. Links open in a new tab.</div></div>
      <div class="vids">${vids(s.topic).map(v=>`<a class="vid" href="${v.href}" target="_blank" rel="noopener"><span class="play">${I.play}</span><span><b>${esc(v.t)}</b><span>${v.s}</span></span></a>`).join('')}</div></div>`;
    foot('continue','Practice');
  }else if(s.type==='intro'){
    body.innerHTML=`<div class="wrap">${kick}<h2 class="qtitle">${esc(node.title)}</h2>
      ${node.src?`<div class="source"><b>From the real ${node.year} exam</b><span>Paraphrased from College Board\'s released free-response question. Open the original to see the figures.</span>
      <div class="links"><a class="pill" href="${node.src.frq}" target="_blank" rel="noopener">${I.file}Original question</a><a class="pill" href="${node.src.sg}" target="_blank" rel="noopener">${I.check}Scoring guidelines</a></div></div>`:''}
      <div class="prose">${node.intro}</div>
      ${node.steps?`<p class="parts-note">${I.map}${node.steps.length} parts. This setup stays pinned above every part, so you can reread it any time.</p>`:''}</div>`;

    foot('continue','Finish');

function renderQ(s, body, kick, qn){
  const setup=qn&&qn.kind==='boss'&&qn.intro?`<details class="setup" ${setupOpen?'open':''}><summary>Problem setup${qn.steps?` · ${qn.steps.length} parts`:''}</summary><div class="prose">${qn.intro}</div>${qn.src?`<div class="links"><a class="pill" href="${qn.src.frq}" target="_blank" rel="noopener">${I.file}Original question</a><a class="pill" href="${qn.src.sg}" target="_blank" rel="noopener">${I.check}Scoring guidelines</a></div>`:''}</details>`:'';
  const wrap=h(`<div class="wrap">${kick}${setup}${s.ctx?`<div class="ctx">${s.ctx}</div>`:''}${s.fig?`<div class="fig">${FIG[s.fig]}</div>`:''}<h2 class="qtitle">${esc(s.q)}</h2><div id="qa"></div></div>`);
  body.innerHTML=''; body.appendChild(wrap);
  const sd=$('details.setup',wrap); if(sd) sd.ontoggle=()=>{setupOpen=sd.open;};
  const qa=$('#qa',wrap); let ctl={ready:()=>false};
  if(s.t==='mc'||s.t==='tf'){
    const opts=s.t==='tf'?[{txt:'True',ok:s.a===true},{txt:'False',ok:s.a===false}]:shuffle(s.c.map((txt,k)=>({txt,ok:k===s.a})));
    qa.innerHTML=`<div class="choices ${s.t==='tf'?'tf':''} ${s.html?'pics':''}">${opts.map((o,k)=>`<button class="choice" data-k="${k}" aria-pressed="false"><span class="k">${k+1}</span><span>${s.html?o.txt:esc(o.txt)}</span></button>`).join('')}</div>`;
    let sel=-1; const bs=[...qa.querySelectorAll('.choice')];
    const pick=(k)=>{sel=k;bs.forEach((b,j)=>b.setAttribute('aria-pressed',j===k));ready();};
    bs.forEach((b,k)=>b.onclick=()=>pick(k));
    ctl={ready:()=>sel>=0, pick:(k)=>{if(k<bs.length)pick(k);},
      check:()=>{qa.firstChild.classList.add('locked');const ok=opts[sel].ok;bs[sel].classList.add(ok?'right':'wrong');if(!ok)bs[opts.findIndex(o=>o.ok)].classList.add('right');return ok;},
      answer:()=>s.html?s.ansText:opts.find(o=>o.ok).txt};
  }else if(s.t==='num'){
    qa.innerHTML=`<div class="numrow"><input id="numin" type="text" inputmode="decimal" autocomplete="off" placeholder="?" aria-label="Your answer">${s.unit?`<span class="unit">${esc(s.unit)}</span>`:''}</div><p class="given">Round sensibly. ${s.alt!=null?'Your class uses g = 10 m/s²; answers with 9.8 count too.':'Using g = 10 m/s² is close enough.'}</p>`;
    const inp=$('#numin',qa); const val=()=>parseFloat(inp.value.replace(',','.').replace(/[^\d.\-eE]/g,''));
    inp.oninput=ready; setTimeout(()=>inp.focus({preventScroll:true}),50);
    const near=(v,t,tol)=>Math.abs(v-t)<=Math.max(tol*Math.abs(t),1e-9);
    ctl={ready:()=>!isNaN(val()), check:()=>{inp.disabled=true;const v=val(),tol=s.tol??0.03;return near(v,s.a,tol)||(s.alt!=null&&near(v,s.alt,tol));},
      answer:()=>`${s.a} ${s.unit||''}`.trim()+(s.alt!=null?` (${s.alt} with g = 9.8)`:'')};
  }else if(s.t==='fbd'){
    const opts=shuffle(s.f);
    qa.innerHTML=`<div class="fbd"><div class="canvas"><svg viewBox="0 0 220 220" id="fbdsvg"></svg></div>
      <div class="fchips">${opts.map((o,k)=>`<button class="fchip" data-k="${k}" aria-pressed="false">${dirIcon(o.dir)}<span>${esc(o.label)}</span></button>`).join('')}</div></div>
      <p class="given">Tap forces to add them to the diagram. Tap again to remove.</p>`;
    const on=new Set(), bs=[...qa.querySelectorAll('.fchip')], svg=$('#fbdsvg',qa);
    const draw=()=>{svg.innerHTML=fbdSvg(opts.filter((o,k)=>on.has(k)));};
    bs.forEach((b,k)=>b.onclick=()=>{on.has(k)?on.delete(k):on.add(k);b.setAttribute('aria-pressed',on.has(k));draw();ready();});
    draw();
    ctl={ready:()=>on.size>0, check:()=>{qa.querySelector('.fchips').classList.add('locked');return opts.every((o,k)=>!!o.ok===on.has(k));},
      answer:()=>opts.filter(o=>o.ok).map(o=>o.label).join(', ')};
  }else if(s.t==='tiles'){
    const bank=shuffle(s.tiles.map((t,k)=>({t,k}))); const picked=[];
    qa.innerHTML=`<div class="tiles-wrap"><div class="tiles-ans" id="tans" aria-label="Your equation"></div><div class="tiles-bank" id="tbank"></div></div>`;
    const ans=$('#tans',qa), bk=$('#tbank',qa);
    const paint=()=>{
      ans.innerHTML=picked.map((p,j)=>`<button class="tile" data-j="${j}">${esc(p.t)}</button>`).join('');
      bk.innerHTML=bank.map(b=>`<button class="tile ${picked.includes(b)?'ghost':''}" data-k="${b.k}">${esc(b.t)}</button>`).join('');
      ans.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.j,1);paint();ready();});
      bk.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const it=bank.find(x=>x.k==b.dataset.k);if(!picked.includes(it)){picked.push(it);paint();ready();}});
    };
    paint();
    ctl={ready:()=>picked.length>0, check:()=>{qa.firstChild.classList.add('locked');return picked.map(p=>p.t).join(' ')===s.ans.join(' ');}, answer:()=>s.ans.join(' ')};
  }
  return ctl;
}

function dirIcon(dir){const r=dir*Math.PI/180,x=11+8*Math.cos(r),y=11-8*Math.sin(r),x0=11-6*Math.cos(r),y0=11+6*Math.sin(r);
  return `<svg viewBox="0 0 22 22"><line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" class="s-force" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah-force)"/></svg>`;}
function fbdSvg(list){
  const cx=110,cy=110,L=72; const groups={};
  list.forEach(f=>{(groups[f.dir]=groups[f.dir]||[]).push(f);});
  let out='';
  Object.entries(groups).forEach(([d,fs])=>{const r=d*Math.PI/180,ux=Math.cos(r),uy=-Math.sin(r),px=-uy,py=ux;
    fs.forEach((f,j)=>{const o=(j-(fs.length-1)/2)*16; const sx=cx+ux*9+px*o, sy=cy+uy*9+py*o, ex=cx+ux*L+px*o, ey=cy+uy*L+py*o;
      const lx=cx+ux*(L+20)+px*o*1.6, ly=cy+uy*(L+20)+py*o*1.6+4;
      out+=arr(sx.toFixed(1),sy.toFixed(1),ex.toFixed(1),ey.toFixed(1),'force',3.5)+`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" class="t-force">${sub(f.sym)}</text>`;});});
  return out+`<circle cx="${cx}" cy="${cy}" r="7" class="f-ink"/>`+(list.length?'':`<text x="110" y="150" text-anchor="middle" class="t-muted" style="font-family:var(--f-display);font-size:12px;font-weight:600">your object</text>`);
}

function ready(){const b=$('#lbtn');if(b&&cur&&b.dataset.mode==='check')b.disabled=!cur.ready();}
function foot(mode,label){
  const f=$('#lfoot'); f.className='l-foot';
  if(mode==='check'){f.innerHTML=`<div class="wrap"><button class="btn" id="lbtn" data-mode="check" disabled>Check</button></div>`;$('#lbtn').onclick=doCheck;}
  else{f.innerHTML=`<div class="wrap"><button class="btn" id="lbtn" data-mode="next">${label||'Continue'}</button></div>`;$('#lbtn').onclick=next;}
}
const GOOD=['Nice!','Correct!','You got it!','Exactly!','Solid.'];
function doCheck(){
  if(!cur||!cur.ready())return;
  const s=R.steps[R.i]; const ok=cur.check(); const f=$('#lfoot');
  if(R.mode==='placement') R.answers[s.area]=ok;
  if(s.id&&QINDEX[s.id]){ if(!ok){S.miss=S.miss||{};S.miss[s.id]=1;if(!R.retried.has(s))R.firstMiss.add(s.id);save();} else if(R.mode==='practice'&&S.miss&&S.miss[s.id]&&!R.firstMiss.has(s.id)){delete S.miss[s.id];save();} }
  if(ok){sGood();}else{sBad();R.miss++;
    if(R.mode!=='placement'){R.hearts--;const hh=$('#lh');hh.querySelector('span').textContent=R.hearts;hh.classList.remove('hit');void hh.offsetWidth;hh.classList.add('hit');}
    if((R.mode==='lesson'||R.mode==='boss'||R.mode==='practice')&&!R.retried.has(s)){R.retried.add(s);const c={...s};R.retried.add(c);R.steps.push(c);}}
  f.className='l-foot '+(ok?'good':'bad');
  f.innerHTML=`<div class="wrap"><div class="fb"><span class="badge">${ok?I.check:I.x}</span><div>
    <h4>${ok?GOOD[Math.floor(Math.random()*GOOD.length)]:'Not quite'}</h4>
    ${ok?'':`<p>Answer: <span class="ans">${esc(cur.answer())}</span></p>`}<p>${esc(s.why||'')}</p></div></div>
    <button class="btn ${ok?'':'red'}" id="lbtn" data-mode="next">${R.hearts<=0?'See results':'Continue'}</button></div>`;
  $('#lbtn').onclick=next; $('#lbtn').focus({preventScroll:true});
}
function next(){
  if(R.hearts<=0) return fail();
  R.i++;
  if(R.i>=R.steps.length) return finish();
  showStep();
}
function fail(){
  $('#lbar').style.width='100%';
  $('#lbody').innerHTML=R.mode==='jump'
    ?`<div class="wrap end">${newt('sad','big')}<h2 class="fail">Not this time</h2><p class="prose">Two misses ends the check. Work through the levels before it, or try the jump again later.</p></div>`
    :`<div class="wrap end">${newt('sad','big')}<h2 class="fail">Out of hearts</h2><p class="prose">Mistakes are how this sticks. Reread the lesson cards, then try again.</p></div>`;
  const f=$('#lfoot');f.className='l-foot';
  f.innerHTML=`<div class="wrap"><button class="btn ghost" id="lq">Back to path</button><button class="btn" id="lr">Try again</button></div>`;
  $('#lq').onclick=closeLesson; $('#lr').onclick=()=>{const n=R.node;$('.lesson').remove();n.kind==='jump'?startJump(n.target):startNode(n);};
}
function finish(){
  $('#lbar').style.width='100%';
  if(R.mode==='placement') return placementResults();
  if(R.mode==='practice') return practiceDone();
  if(R.mode==='jump') return jumpDone();
  const n=R.node, first=!S.done[n.id], perfect=R.miss===0;
  const xp=(n.kind==='boss'?30:10)+(perfect?5:0);
  S.done[n.id]=true; addXp(xp); sWin(); confetti();
  const acc=Math.round(100*R.total/(R.total+R.miss));
  const secs=Math.round((Date.now()-R.t0)/1000), tm=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  $('#lbody').innerHTML=`<div class="wrap end">${newt('happy','big')}
    <h2>${n.kind==='boss'?'Boss defeated!':perfect?'Perfect lesson!':'Lesson complete!'}</h2>
    <p class="prose">${n.kind==='boss'?(n.year?`You just worked a real ${n.year} AP free-response question.`:'Challenge cleared.'):first?'Next level unlocked.':'Good review.'} ${S.streak>1?`${S.streak} day streak.`:''}</p>
    <div class="tiles3">
      <div class="st" style="--c:var(--xp)"><small>Total XP</small><b>${I.bolt}${xp}</b></div>
      <div class="st" style="--c:var(--go)"><small>Accuracy</small><b>${I.target}${acc}%</b></div>
      <div class="st" style="--c:var(--field)"><small>Time</small><b>${I.clock}${tm}</b></div>
    </div></div>`;
  const f=$('#lfoot');f.className='l-foot';
  f.innerHTML=`<div class="wrap"><button class="btn" id="lbtn" data-mode="next">Continue</button></div>`;
  $('#lbtn').onclick=closeLesson;
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d');const cs=getComputedStyle(document.documentElement);
  const cols=['--force','--go','--xp','--field'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:110},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++t<110)requestAnimationFrame(f);else c.remove();})();
}

document.addEventListener('keydown',e=>{
  if(!R)return; const b=$('#lbtn');
  if(e.key==='Enter'&&b&&!b.disabled){e.preventDefault();b.click();}
  else if(/^[1-9]$/.test(e.key)&&cur&&cur.pick&&b&&b.dataset.mode==='check'){cur.pick(+e.key-1);}
  else if(e.key==='Escape'){closeLesson();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!R)closeSheet();});

/* ---------- account ---------- */
function acctHtml(){
  const me=ACCT.me;
  const img=me&&me.id&&me.avatarUrl?`<img src="${esc(me.avatarUrl)}" alt="">`:`<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`;
  return `${img}<i class="dot ${ACCT.state}"></i>`;
}
function renderAcct(){const b=$('#acct'); if(b) b.innerHTML=acctHtml();}
function openSheet(html){
  closeSheet();
  const bg=h(`<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`);
  bg.onclick=e=>{if(e.target===bg)closeSheet();};
  document.body.appendChild(bg);
  return bg.firstElementChild;
}
function closeSheet(){const s=$('.sheet-bg'); if(s) s.remove();}
function openAccount(){
  const me=ACCT.me, name=(me&&me.name)||(ACCT.state==='synced'?'Your account':'Guest');
  const status={synced:'Signed in. Your progress saves to your Claude account, so it follows you to any device.',
    device:ACCT.web?'Progress saves in this browser on this device.':'Not signed in here, so progress saves in this browser only. Open this page while signed in to claude.ai to keep it everywhere.',
    loading:'Connecting to your account…'}[ACCT.state];
  const doneN=NODES.filter(n=>S.done[n.id]).length;
  const sh=openSheet(`
    <div class="sheet-head">${acctHtml()}<div><h3>${esc(name)}</h3><p class="sync ${ACCT.state}">${status}</p></div>
      <button class="iconbtn" id="sx" aria-label="Close">${I.x}</button></div>
    <div class="tiles3">
      <div class="st" style="--c:var(--xp)"><small>XP</small><b>${I.bolt}${S.xp}</b></div>
      <div class="st" style="--c:var(--force)"><small>Streak</small><b>${I.flame}${S.streak}</b></div>
      <div class="st" style="--c:var(--go)"><small>Levels</small><b>${I.check}${doneN}/${NODES.length}</b></div>
    </div>
    <h4>Daily goal</h4>
    <div class="goalopts">${[[20,'Casual'],[50,'Regular'],[100,'Serious']].map(([v,l])=>`<button class="choice" data-goal="${v}" aria-pressed="${goal()===v}"><b>${l}</b><span>${v} XP a day</span></button>`).join('')}</div>
    <h4>Your level</h4>
    <p class="muted">${S.place?`Placement test: ${S.place.score} of ${S.place.total} correct.`:'You haven\'t taken the placement test yet.'}</p>
    <div class="sheet-btns">
      <button class="btn ghost" id="sp">${S.place?'Retake placement test':'Take placement test'}</button>
      <button class="btn ghost" id="ss">${S.skip?'Lock levels again':'Unlock every level'}</button>
      <button class="btn ghost danger" id="sr">Reset progress</button>
    </div>`);
  $('#sx',sh).onclick=closeSheet;
  sh.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;save();renderShell();openAccount();});
  $('#sp',sh).onclick=()=>{closeSheet();startPlacement();};
  $('#ss',sh).onclick=()=>{S.skip=!S.skip;save();renderShell();openAccount();};
  $('#sr',sh).onclick=()=>{
    const b=$('#sr',sh);
    if(b.dataset.armed){const snd=S.sound;S={...DEF,sound:snd,onboarded:true};save();closeSheet();renderShell();return;}
    b.dataset.armed='1';b.textContent='Tap again to erase everything';
  };
}

/* ---------- jump ahead: a short check on everything before a locked level ---------- */
function openJump(n){
  const sh=openSheet(`
    <div class="sheet-head">${newt('wow')}<div><h3>Jump to ${esc(n.title.replace(/^(Final )?FRQ: /,''))}?</h3>
      <p class="muted">Pass a 5-question check on the levels before it and they\'ll count as done. Two misses ends the check.</p></div></div>
    <div class="sheet-btns"><button class="btn ghost" id="jn">Not now</button><button class="btn" id="jy">Start check</button></div>`);
  $('#jn',sh).onclick=closeSheet;
  $('#jy',sh).onclick=()=>{closeSheet();startJump(n);};
}
function startJump(target){
  const before=target.sec.nodes.slice(0,target.sec.nodes.indexOf(target));
  // lesson questions stand on their own; FRQ steps lean on their intro, so use them only to fill gaps
  const ok=q=>q.t!=='tiles';
  const lessonQs=shuffle(before.flatMap(n=>n.qs||[]).filter(ok)), bossQs=shuffle(before.flatMap(n=>n.steps||[]).filter(q=>ok(q)&&q.ctx));
  startNode({id:'jump-'+target.id,kind:'jump',target,tag:'Jump ahead',title:target.title,qs:[...lessonQs,...bossQs].slice(0,5)});
}
function jumpDone(){
  const t=R.node.target, arr=t.sec.nodes, idx=arr.indexOf(t);
  arr.slice(0,idx).forEach(n=>{S.open[n.id]=true; if(n.kind==='lesson') S.done[n.id]=true;});
  S.open[t.id]=true; addXp(10); sWin(); confetti();
  $('#lbody').innerHTML=`<div class="wrap end">${newt('wow','big')}<h2>Jumped ahead!</h2>
    <p class="prose">${esc(t.title)} is unlocked. Earlier FRQ levels stay open if you want to go back to them.</p></div>`;
  const f=$('#lfoot');f.className='l-foot';
  f.innerHTML=`<div class="wrap"><button class="btn ghost" id="lq">Back to path</button><button class="btn" id="lgo">Start it</button></div>`;
  $('#lq').onclick=closeLesson; $('#lgo').onclick=()=>{$('.lesson').remove();R=null;startNode(t);};
}

/* ---------- placement test: one question per area, sets what you skip and what to focus on ---------- */
const AREAS=[
  {id:'2.1',node:'2.1',label:'Systems & center of mass',place:true},
  {id:'2.2',node:'2.2',label:'Free-body diagrams',place:true},
  {id:'2.3',node:'2.3',label:'Newton\'s 3rd law',place:true},
  {id:'2.4',node:'2.4',label:'Newton\'s 1st law',place:true},
  {id:'2.5',node:'2.5',label:'Newton\'s 2nd law',place:true},
  {id:'2.6',node:'2.6',label:'Gravitational force',place:true},
  {id:'2.7',node:'2.7',label:'Friction',place:true},
  {id:'2.8',node:'2.8',label:'Spring forces',place:true},
  {id:'2.9',node:'2.9',label:'Circular motion',place:true},
  {id:'joined',node:'c-joined',label:'Joined bodies & pulleys'},
  {id:'angles',node:'p-angles',label:'Forces at angles'},
  {id:'elev',node:'c-elev',label:'Elevators & apparent weight'},
];
const PLACEMENT=[
  {area:'2.1',t:'mc',q:'A 1 kg mass sits at x = 0 and a 3 kg mass at x = 4 m. Where is the center of mass?',c:['3 m','2 m','1 m','4/3 m'],a:0,why:'(1·0 + 3·4) / 4 = 3 m, closer to the heavier mass.'},
  {area:'2.2',t:'fbd',q:'You push a box across a rough floor with a horizontal hand at constant speed. Pick every force on the box.',f:[F('g','Gravity','F_g',-90,1),F('n','Normal from floor','F_N',90,1),F('p','Push from your hand','F_P',0,1),F('fr','Kinetic friction','F_f',180,1),F('m','Force of motion','F_m',0,0)],why:'Four real forces. "Force of motion" isn\'t a thing.'},
  {area:'2.3',t:'mc',q:'A 2 kg ball hits a 50 kg student. How does the force on the ball compare with the force on the student?',c:['Equal','Bigger on the ball','Bigger on the student','Zero on the student'],a:0,why:'Newton\'s 3rd law pairs are always equal in size.'},
  {area:'2.4',t:'mc',q:'A space probe coasts at 300 m/s far from any planet, engines off. What is the net force on it?',c:['Zero','Forward, to keep it moving','Backward','Equal to its weight'],a:0,why:'Constant velocity needs no net force.'},
  {area:'2.5',t:'num',q:'A 6 kg box is pushed with 30 N against 12 N of friction. Find its acceleration.',a:3,unit:'m/s²',why:'(30 − 12) / 6 = 3 m/s².'},
  {area:'2.6',t:'mc',q:'A satellite moves to 3 times its distance from Earth\'s center. The gravitational force on it becomes…',c:['1/9 as large','1/3 as large','3 times as large','The same'],a:0,why:'Inverse square: (1/3)² = 1/9.'},
  {area:'2.7',t:'mc',q:'A 5 kg box sits on a floor with μs = 0.4 (max static friction 20 N). You push it with 10 N and it stays put. Friction on it is…',c:['10 N','20 N','2 N','0 N'],a:0,why:'Static friction matches the push, up to its 20 N maximum.'},
  {area:'2.8',t:'num',q:'A spring with k = 150 N/m is stretched 0.20 m. How much force does it exert?',a:30,unit:'N',why:'F = kΔx = 150 × 0.20 = 30 N.'},
  {area:'2.9',t:'mc',q:'A car rounds a flat curve at constant speed. What force points it toward the center?',c:['Static friction from the road','Centripetal force from the engine','Kinetic friction','The normal force'],a:0,why:'The tires grip without sliding, so static friction does the centripetal job.'},
  {area:'joined',t:'num',q:'A 4 kg cart on a frictionless table is tied over a pulley to a hanging 1 kg mass. Find the acceleration.',a:2,alt:1.96,unit:'m/s²',why:'a = (1 × 10) / 5 = 2 m/s².'},
  {area:'angles',t:'mc',q:'You pull a sled with a rope angled upward. Compared with mg, the normal force on the sled is…',c:['Smaller','Larger','Equal','Zero'],a:0,why:'The rope\'s upward component lifts part of the weight.'},
  {area:'elev',t:'num',q:'A 60 kg student stands on a scale in an elevator accelerating upward at 1 m/s². What does the scale read?',a:660,alt:648,unit:'N',why:'F_N = m(g + a) = 60 × 11 = 660 N.'},
];
function startPlacement(){
  startNode({id:'placement',kind:'placement',tag:'Placement test',title:'Find your level',qs:PLACEMENT,
    intro:`<p>12 questions, one for each skill in the unit. There are no hearts and no penalty, so just answer what you know.</p><p>Get one right and that lesson counts as done. Miss one and it becomes a <b>focus</b> on your path.</p>`});
}
function placementResults(){
  const res=R.answers, strong=AREAS.filter(a=>res[a.id]), weak=AREAS.filter(a=>!res[a.id]);
  AREAS.forEach(a=>{if(res[a.id]&&a.place) S.done[a.node]=true;});
  S.focus=weak.map(a=>a.node); weak.forEach(a=>{S.open[a.node]=true;});
  S.place={date:Date.now(),score:strong.length,total:AREAS.length};
  S.onboarded=true; addXp(15); sWin();
  const placed=strong.filter(a=>a.place).length;
  $('#lbody').innerHTML=`<div class="wrap end">${newt(strong.length>=8?'wow':'happy','big')}
    <h2>${strong.length} of ${AREAS.length} correct</h2>
    <p class="prose">${placed?`You tested out of ${placed} lesson${placed>1?'s':''}. `:''}${weak.length?`Your path now marks ${weak.length} focus area${weak.length>1?'s':''}, and they\'re unlocked so you can start there.`:'Nothing to focus on. Try the FRQ levels next.'}</p>
    <ul class="results">${AREAS.map(a=>`<li><span>${esc(a.label)}</span><span class="rchip ${res[a.id]?'ok':'no'}">${res[a.id]?'Strong':'Focus'}</span></li>`).join('')}</ul></div>`;
  const f=$('#lfoot');f.className='l-foot';
  f.innerHTML=`<div class="wrap"><button class="btn" id="lbtn" data-mode="next">See my path</button></div>`;
  $('#lbtn').onclick=closeLesson;
}

/* ---------- first visit ---------- */

    $('#onb').innerHTML=`<div class="newt-say">${newt('happy')}<div class="say"><b>Hi${first?' '+esc(first):''}! I\'m Newt.</b> I\'ll get you through AP Physics 1 forces, one level at a time. How much do you want to practice each day?</div></div>
      <div class="choices">${[[20,'Casual','About 5 minutes'],[50,'Regular','About 12 minutes'],[100,'Serious','About 25 minutes']].map(([v,l,d])=>`<button class="choice" data-goal="${v}" aria-pressed="${g===v}"><span class="k">${v}</span><span><b>${l}</b> · ${d}</span></button>`).join('')}</div>

  };
  const step2=()=>{
    $('#onb').innerHTML=`<div class="newt-say">${newt('wow')}<div class="say"><b>Hi${first?' '+esc(first):''}! I\'m Newt.</b> Where do you want to start?</div></div>
      <div class="choices">
        <button class="choice" id="o-place"><span class="k">${I.target}</span><span><b>Find my level</b><br>A 12-question placement test. Skip what you know, focus on what you don\'t.</span></button>
        <button class="choice" id="o-zero"><span class="k">${I.star}</span><span><b>Start from scratch</b><br>Begin with Topic 2.1 and work through in order.</span></button>
      </div>`;
    $('#onbf').innerHTML='';
    $('#o-place').onclick=()=>{ov.remove();startPlacement();};
    $('#o-zero').onclick=()=>{S.onboarded=true;save();ov.remove();renderShell();};

}

renderShell();
(async()=>{
